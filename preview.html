function show(id){document.querySelectorAll('.app>section').forEach(s=>s.hidden=true);document.getElementById(id).hidden=false;if(id==='trip')renderTrip();if(id==='spot')renderSpots();if(id==='food')renderFoods();if(id==='hotel')renderHotels();if(id==='transport')renderTrans();scrollTo(0,0)}function copy(t){navigator.clipboard?.writeText(t).then(()=>alert('已复制'))}function nav(n,a){location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n+' '+a)}function card(a,b,c,d=''){return `<div class="card"><div class="muted">${a}</div><h3>${b}</h3><div class="addr">📍 ${c}</div>${d?`<div class="addr">${d}</div>`:''}<div class="actions"><button onclick="copy('${b.replace(/'/g,"\\'")}')">复制名称</button><button onclick="copy('${c.replace(/'/g,"\\'")}')">复制地址</button><button class="nav" onclick="nav('${b.replace(/'/g,"\\'")}','${c.replace(/'/g,"\\'")}')">导航</button><button class="primary" onclick="add('${b.replace(/'/g,"\\'")}','${c.replace(/'/g,"\\'")}')">加入行程</button></div></div>`}function renderTrip(){let ds=plan==='A'?daysA:daysB;tripBody.innerHTML=`<div class="card"><b>${plan==='A'?'方案 A · 福州+平潭+泉州+厦门四城完整版':'方案 B · 福州+平潭+厦门三城休闲版'}</b><div class="days">${ds.map((d,i)=>`<button class="day ${i===day?'on':''}" onclick="day=${i};renderTrip()"><b>${d.date}</b><small>${d.id}</small></button>`).join('')}</div></div><div class="timeline">${ds[day].items.map((x,i)=>`<div class="card event"><div class="time">${x.time}</div><h3>${x.name}</h3><div class="addr">📍 ${x.address}</div><div class="actions"><button onclick="copy('${x.name.replace(/'/g,"\\'")}')">复制名称</button><button onclick="copy('${x.address.replace(/'/g,"\\'")}')">复制地址</button><button class="nav" onclick="nav('${x.name.replace(/'/g,"\\'")}','${x.address.replace(/'/g,"\\'")}')">导航</button><button onclick="edit(${i})">编辑</button><button onclick="del(${i})">删除</button></div></div>`).join('')}</div><button class="btn primary" onclick="addEvent()">＋ 添加当天日程</button>`}function add(n,a){(plan==='A'?daysA:daysB)[day].items.push({time:'09:00',name:n,address:a});renderTrip()}function addEvent(){let n=prompt('日程名称');if(!n)return;let a=prompt('地址，可留空','');(plan==='A'?daysA:daysB)[day].items.push({time:'09:00',name:n,address:a||'地址待补'});renderTrip()}function edit(i){let ds=plan==='A'?daysA:daysB,x=ds[day].items[i],n=prompt('修改名称',x.name);if(n===null)return;let a=prompt('修改地址',x.address);x.name=n;x.address=a||x.address;renderTrip()}function del(i){if(confirm('删除这条日程？')){(plan==='A'?daysA:daysB)[day].items.splice(i,1);renderTrip()}}function renderSpots(){spotTabs.innerHTML=C.map(c=>`<button class="tab ${city===c?'on':''}" onclick="city='${c}';renderSpots()">${c}</button>`).join('');spotList.innerHTML=spots.filter(x=>city==='全部'||x[0]===city).map(x=>card(...x)).join('')}function renderFoods(){foodTabs.innerHTML=C.map(c=>`<button class="tab ${foodCity===c?'on':''}" onclick="foodCity='${c}';renderFoods()">${c}</button>`).join('');foodList.innerHTML=foods.filter(x=>foodCity==='全部'||x[0]===foodCity).map(x=>card(...x)).join('')}function renderHotels(){hotelList.innerHTML=hotels.map(x=>card(x[0],x[1],x[2])).join('')}function renderTrans(){transportList.innerHTML=transports.map(x=>card(x[0],x[2],x[4],x[3])).join('')}function newTrip(){let n=prompt('新建行程名称','新建福建行程');if(n)alert('已建立新行程：'+n+'；正式版下一步可继续保存到本地数据')}function ask(){let text=q.value.trim();if(!text)return;msgs.insertAdjacentHTML('beforeend',`<div class="msg user">${text.replace(/</g,'&lt;')}</div><div class="msg ai" id="wait">正在思考…</div>`);q.value='';fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,tripContext:JSON.stringify(plan==='A'?daysA:daysB).slice(0,12000)})}).then(r=>r.json()).then(d=>{wait?.remove();msgs.insertAdjacentHTML('beforeend',`<div class="msg ai">${String(d.reply||'AI 暂无回复').replace(/</g,'&lt;')}</div>`)}).catch(()=>{wait?.remove();msgs.insertAdjacentHTML('beforeend','<div class="msg ai">AI 接口连接失败，请检查 Cloudflare Functions。</div>')})}show('home');</scri
