function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.page===id));if(id==='trips')renderTrips();if(id==='spots')renderSpots();if(id==='food')renderFoods();if(id==='hotels')renderHotels();if(id==='transport')renderTransport();window.scrollTo(0,0)}
function copy(t){navigator.clipboard?.writeText(t);toast('已复制')}function nav(name,address){window.open('https://uri.amap.com/search?keyword='+encodeURIComponent((name||'')+' '+(address||'')),'_blank')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';x.style.position='fixed';x.style.bottom='95px';x.style.left='50%';x.style.transform='translateX(-50%)';x.style.background='#222';x.style.color='#fff';x.style.padding='10px 14px';x.style.borderRadius='14px';setTimeout(()=>x.style.display='none',1200)}
function act(name,address,city=''){return `<div class="actions"><button class="btn" onclick="copy('${e(name)}')">复制名称</button><button class="btn" onclick="copy('${e(address)}')">复制地址</button><button class="btn" onclick="nav('${e(name)}','${e(address)}')">导航</button><button class="btn primary" onclick="addFromCatalog('${e(name)}','${e(address)}','${e(city)}')">加入行程</button></div>`}function e(s){return String(s||'').replaceAll('\\','\\\\').replaceAll("'","\\'")}
function renderTrips(){let base=`<div class="card trip-head"><div class="crumb">我的行程</div><div class="trip-level">一级类目：我的行程</div><h2 style="margin:10px 0 5px">十一福建游</h2><div class="muted">二级类目：十一福建游</div></div>`;base+=`<div class="title"><h3>查看方案</h3></div><div class="plans"><button class="plan ${state.plan==='A'?'on':''}" onclick="state.plan='A';state.day=0;renderTrips()"><b>方案 A</b><small>福州 + 平潭 + 泉州 + 厦门四城完整版</small></button><button class="plan ${state.plan==='B'?'on':''}" onclick="state.plan='B';state.day=0;renderTrips()"><b>方案 B</b><small>福州 + 平潭 + 厦门三城休闲版</small></button></div>`;const arr=schedules[state.plan];base+=`<div class="muted" style="margin:5px 0">三级类目：方案 ${state.plan}</div><div class="days">${arr.map((d,i)=>`<button class="day ${i===state.day?'on':''}" onclick="state.day=${i};renderTrips()"><b>${d.date}</b><small>DAY ${i}</small></button>`).join('')}</div>`;const d=arr[state.day];base+=`<div class="card"><div class="crumb">方案 ${state.plan} / ${d.date}</div><h2 style="margin:0">${d.title}</h2><div class="muted" style="margin-top:5px">下面是当天详细行程，地址支持复制和导航</div></div><div class="timeline">${d.items.map((x,i)=>`<div class="event card"><div class="event-time">${x[0]}</div><h3>${x[1]}</h3><div class="addr">📍 ${x[2]}</div><div class="muted" style="margin-top:5px">${x[3]}</div>${act(x[1],x[2],guessCity(x[2]))}<div class="actions"><button class="btn" onclick="editEvent(${i})">编辑</button><button class="btn danger" onclick="deleteEvent(${i})">删除</button></div></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="addEvent()">＋ 添加当天日程</button></div>`;document.getElementById('tripList').innerHTML='';document.getElementById('tripDetail').innerHTML=base+customTrips.map((t,i)=>`<div class="card" style="margin-top:18px"><div class="crumb">新建行程</div><b>${t.name}</b><div class="muted">${t.start} → ${t.end} · ${t.city||'未填写城市'}</div><div class="actions"><button class="btn" onclick="openCustom(${i})">打开</button><button class="btn danger" onclick="customTrips.splice(${i},1);localStorage.setItem('lvban-trips',JSON.stringify(customTrips));renderTrips()">删除</button></div></div>`).join('')}
function guessCity(a){return /福州/.test(a)?'福州':/平潭/.test(a)?'平潭':/泉州|石狮/.test(a)?'泉州':'厦门'}
function addEvent(){modal('添加日程',`<div class="form"><label>时间</label><input id="xTime" type="time" value="09:00"><label>名称</label><input id="xName"><label>地址</label><input id="xAddr"><label>备注</label><textarea id="xNote"></textarea><button class="btn primary" onclick="saveEvent()">加入当天</button></div>`)}function saveEvent(){schedules[state.plan][state.day].items.push([document.getElementById('xTime').value,document.getElementById('xName').value,document.getElementById('xAddr').value,document.getElementById('xNote').value]);schedules[state.plan][state.day].items.sort((a,b)=>a[0].localeCompare(b[0]));closeModal();renderTrips()}function editEvent(i){let x=schedules[state.plan][state.day].items[i];modal('编辑日程',`<div class="form"><label>时间</label><input id="xTime" type="time" value="${e(x[0])}"><label>名称</label><input id="xName" value="${e(x[1])}"><label>地址</label><input id="xAddr" value="${e(x[2])}"><label>备注</label><textarea id="xNote">${x[3]||''}</textarea><button class="btn primary" onclick="schedules[state.plan][state.day].items[${i}]=[xTime.value,xName.value,xAddr.value,xNote.value];closeModal();renderTrips()">保存</button></div>`)}function deleteEvent(i){if(confirm('删除这条日程？')){schedules[state.plan][state.day].items.splice(i,1);renderTrips()}}
function addFromCatalog(name,address,city){schedules[state.plan][state.day].items.push(['—',name,address,'从景点/美食库加入']);renderTrips();toast('已加入当天行程')}
function renderSpots(){document.getElementById('spotCities').innerHTML=C.map(c=>`<button class="chip ${state.city===c?'on':''}" onclick="state.city='${c}';renderSpots()">${c}</button>`).join('');document.getElementById('spotList').innerHTML=spots.filter(x=>state.city==='全部'||x[0]===state.city).map(x=>`<div class="data card"><div class="city">${x[0]}</div><h3>${x[1]}</h3><div class="addr">📍 ${x[2]}</div>${act(x[1],x[2],x[0])}</div>`).join('')}
function renderFoods(){document.getElementById('foodCities').innerHTML=C.map(c=>`<button class="chip ${state.foodCity===c?'on':''}" onclick="state.foodCity='${c}';renderFoods()">${c}</button>`).join('');document.getElementById('foodList').innerHTML=foods.filter(x=>state.foodCity==='全部'||x[0]===state.foodCity).map(x=>`<div class="data card"><div class="city">${x[0]}</div><h3>${x[1]}</h3><div class="addr">📍 ${x[2]}</div>${act(x[1],x[2],x[0])}</div>`).join('')}
function renderHotels(){document.getElementById('hotelList').innerHTML=hotels.map(x=>`<div class="data card"><div class="city">${x[0]} · ${x[3]}</div><h3>${x[1]}</h3><div class="addr">📍 ${x[2]}</div>${act(x[1],x[2],x[3])}</div>`).join('')}
const transports=[['9月29日','福州 → 平潭','福州 → 平潭','包车/拼车或D9971'],['10月1日','平潭 → 泉州','平潭站 → 泉州站','D6294 10:45–12:36'],['10月2日','泉州 → 厦门','泉州南站 → 厦门站','D6567 约50分钟'],['10月4日','厦门 → 杭州','厦门机场/车站 → 杭州','飞机/高铁']];function renderTransport(){document.getElementById('transportList').innerHTML=transports.map(x=>`<div class="data card"><div class="city">${x[0]}</div><h3>${x[1]}</h3><div class="addr">📍 ${x[2]}</div><div class="muted">${x[3]}</div><div class="actions"><button class="btn" onclick="copy('${e(x[2])}')">复制路线</button><button class="btn" onclick="nav('交通','${e(x[2])}')">导航</button></div></div>`).join('')}
function newData(type){modal('新增 '+(type==='spot'?'景点':type==='food'?'美食':type==='hotel'?'酒店':'交通'),`<div class="form"><label>名称</label><input id="dName"><label>城市</label><input id="dCity"><label>地址 / 路线</label><input id="dAddr"><label>备注</label><textarea id="dNote"></textarea><button class="btn primary" onclick="toast('已保存到本地');closeModal()">保存</button></div>`)}
function newTrip(){modal('新建行程',`<div class="form"><div class="trip-level">一级类目：我的行程</div><label>二级：行程名称</label><input id="tName" placeholder="例如：十一福建游"><label>开始日期</label><input id="tStart" type="date"><label>结束日期</label><input id="tEnd" type="date"><label>城市 / 地区</label><input id="tCity" placeholder="福州 / 平潭 / 泉州 / 厦门"><label>三级方案</label><select id="tPlan"><option>方案A</option><option>方案B</option></select><button class="btn primary" onclick="saveTrip()">创建行程</button></div>`)}function saveTrip(){let t={name:tName.value,start:tStart.value,end:tEnd.value,city:tCity.value,plan:tPlan.value};if(!t.name||!t.start||!t.end)return toast('请先填写名称和日期');customTrips.push(t);localStorage.setItem('lvban-trips',JSON.stringify(customTrips));closeModal();renderTrips();toast('新建行程成功')}function openCustom(i){toast('已打开：'+customTrips[i].name)}
function modal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
async function askAI(){const input=document.getElementById('aiInput'),text=input.value.trim();if(!text)return;input.value='';const box=document.getElementById('messages');box.insertAdjacentHTML('beforeend',`<div class="msg user">${e(text)}</div>`);const pending=document.createElement('div');pending.className='msg ai';pending.textContent='正在思考…';box.appendChild(pending);box.scrollTop=box.scrollHeight;try{const d=schedules[state.plan][state.day];const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,context:{trip:'十一福建游',plan:state.plan,date:d.date,title:d.title,items:d.items}})});const j=await r.json();pending.textContent=j.reply||j.error||'AI 暂无回复';}catch(err){pending.textContent='AI 连接失败，请检查 Cloudflare Pages 的 ARK_API_KEY 与 ARK_ENDPOINT_ID。'}box.scrollTop=box.scrollHeight}document.getElementById('aiInput').addEventListener('keydown',x=>{if(x.key==='Enter'&&!x.shiftKey){x.preventDefault();askAI()}});
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schedules,customTrips,hotels,spots,foods},null,2)],{type:'application/json'}));a.download='旅伴旅行管家备份.json';a.click()}function resetData(){localStorage.removeItem('lvban-trips');location.reload()}
renderTrips();renderSpots();renderFoods();renderHotels();renderTransport();
