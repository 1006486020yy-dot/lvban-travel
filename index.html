<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ff">
<title>旅伴旅行管家</title>
<style>
:root{
  --bg:#f4f3ff;--card:rgba(255,255,255,.70);--text:#182033;--muted:#75809a;
  --blue:#4f6cff;--purple:#7c4dff;--line:rgba(255,255,255,.72);
  --shadow:0 18px 50px rgba(68,72,145,.13);--r:24px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(124,77,255,.18),transparent 28%),
    radial-gradient(circle at 92% 8%,rgba(79,108,255,.18),transparent 30%),
    linear-gradient(180deg,#fafaff 0%,#eef1ff 100%);
}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}
.app{width:min(520px,100%);min-height:100vh;margin:auto;padding-bottom:88px}
.top{
  position:sticky;top:0;z-index:30;padding:15px 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(248,249,255,.66);backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.55)
}
.logo{font-size:22px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.circle{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:var(--shadow)}
main{padding:0 16px}.page{display:none}.page.active{display:block}
.hero{padding:13px 0 14px}.heroCard{
  position:relative;overflow:hidden;border-radius:30px;padding:25px;
  background:linear-gradient(135deg,#3b48aa,#5c68e4 48%,#7853d7);color:#fff;
  box-shadow:0 24px 60px rgba(78,85,185,.27)
}
.heroCard:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-95px;background:rgba(255,255,255,.13)}
.heroCard:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;left:-60px;bottom:-80px;background:rgba(255,255,255,.10)}
.kicker{font-size:11px;letter-spacing:2px;color:#d5dcff}.hero h1{font-size:29px;margin:8px 0}.hero p{font-size:13px;color:rgba(255,255,255,.82);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.entry{
  min-height:112px;padding:18px;text-align:left;border-radius:21px;
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(20px);
  box-shadow:var(--shadow);transition:.22s
}.entry:active{transform:scale(.97)}.entry b{font-size:25px;display:block;margin-bottom:11px}.entry strong{font-size:15px}.entry span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.card,.tripCard,.itemCard,.aiPanel{
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(150%);
  border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px
}
.section{margin:18px 0}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectionHead h3{margin:0;font-size:17px}
.muted,.small{color:var(--muted)}.small{font-size:12px;line-height:1.65}.row{display:flex;gap:8px}.row>*{flex:1}
.primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;padding:11px 14px;border-radius:13px;font-weight:750;box-shadow:0 10px 24px rgba(79,108,255,.24)}
.ghost{background:rgba(255,255,255,.65);color:#39445a;padding:10px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.78)}
.danger{background:#fff0f0;color:#d33;padding:10px 13px;border-radius:12px}
.daybar,.pills{display:flex;gap:8px;overflow:auto;padding:3px 0 10px}.daybtn,.pill{white-space:nowrap;border-radius:15px;background:rgba(255,255,255,.72);padding:10px 13px;box-shadow:var(--shadow);font-size:11px}.daybtn b{display:block;font-size:15px;margin-bottom:3px}.daybtn.on,.pill.on{background:#293458;color:#fff}
.timeline{position:relative;padding:4px 0 4px 22px}.timeline:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:#d9def0}
.event{position:relative;border-radius:18px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.68);box-shadow:var(--shadow)}.event:before{content:"";position:absolute;left:-19px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:3px solid var(--bg)}
.eventTime{font-weight:800;color:var(--blue);font-size:13px}.eventTitle{font-size:15px;font-weight:750;margin:5px 0}.eventAddr{font-size:11px;color:var(--muted);line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{background:#f1f3fa;padding:8px 10px;border-radius:10px;font-size:11px}
.itemTop{display:flex;gap:12px}.thumb{width:72px;height:72px;flex:none;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#e3e6f7,#f8f8ff);font-size:25px}.itemCard h3{margin:0 0 5px;font-size:15px}.price{font-size:11px;color:#f18b38;margin-top:5px}.itemBtns{display:flex;gap:7px;margin-top:11px}.itemBtns button{flex:1;background:#f1f3fa;border-radius:10px;padding:9px 5px;font-size:11px}.itemBtns .add{background:#edf0ff;color:var(--blue)}
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;
  display:grid;grid-template-columns:repeat(5,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.70);backdrop-filter:blur(26px) saturate(160%);border-top:1px solid var(--line)
}.nav{background:none;color:#7d879b;font-size:10px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav.on{color:var(--blue)}
.plus{width:48px;height:48px;border-radius:17px;background:#293458;color:#fff;align-self:center;justify-self:center;font-size:22px}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:12px}
.modalWrap{display:none;position:fixed;inset:0;z-index:60;background:rgba(18,22,42,.35);align-items:flex-end;justify-content:center}.modalWrap.on{display:flex}
.modal{width:min(520px,100%);max-height:88vh;overflow:auto;padding:20px;border-radius:28px 28px 0 0;background:rgba(255,255,255,.92);backdrop-filter:blur(24px)}
.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0;font-size:19px}.close{width:34px;height:34px;border-radius:50%;background:#f0f2f8}
.form{display:grid;gap:10px;margin-top:14px}.form label{font-size:11px;color:#69738a}.form input,.form textarea{width:100%;margin-top:5px;border:1px solid #e1e5ef;border-radius:13px;padding:11px;background:#fafbff;outline:none}.form textarea{min-height:100px;resize:vertical}.formBtns{display:flex;gap:8px;margin-top:14px}.formBtns>*{flex:1}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;background:#293458;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.hero,.grid,.section{animation:up .45s ease both}.grid{animation-delay:.06s}.section{animation-delay:.12s}

/* AI：移动端聊天工作台，参考主流 AI App 的聊天布局 */
.aiPage{min-height:calc(100vh - 88px);padding-bottom:92px}
.aiTopbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 2px 10px;
  background:rgba(248,249,255,.72);
  backdrop-filter:blur(22px) saturate(160%);
}
.aiTitle{display:flex;align-items:center;gap:10px}
.aiAvatar{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  color:#fff;font-size:19px;font-weight:800;
  background:linear-gradient(135deg,#526cff,#8b5cf6);
  box-shadow:0 8px 22px rgba(79,108,255,.25)
}
.aiTitle b{font-size:17px}.aiTitle span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.aiMore{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.7);color:#66718a}
.aiQuick{
  display:flex;gap:7px;overflow:auto;padding:2px 0 9px;
  scrollbar-width:none
}.aiQuick::-webkit-scrollbar{display:none}
.aiQuick button{
  flex:none;white-space:nowrap;border:1px solid rgba(255,255,255,.9);
  border-radius:999px;padding:8px 11px;font-size:11px;color:#53617b;
  background:rgba(255,255,255,.68);box-shadow:0 7px 20px rgba(68,72,145,.08)
}
.aiQuick button:active{transform:scale(.96)}
.aiConversation{
  display:flex;flex-direction:column;gap:13px;
  padding:5px 1px 120px
}
.aiWelcome{
  padding:18px 17px;border-radius:22px;
  background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(242,244,255,.78));
  border:1px solid rgba(255,255,255,.92);box-shadow:var(--shadow)
}
.aiWelcome b{font-size:16px}.aiWelcome p{font-size:12px;line-height:1.7;color:var(--muted);margin:7px 0 0}
.aiBubble{
  max-width:88%;font-size:13px;line-height:1.75;padding:12px 14px;
  border-radius:19px;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 9px 25px rgba(68,72,145,.08)
}
.aiBubble.user{
  align-self:flex-end;color:#fff;
  border-bottom-right-radius:7px;
  background:linear-gradient(135deg,#4f6cff,#7658e8)
}
.aiBubble.assistant{
  align-self:flex-start;background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.92);border-bottom-left-radius:7px
}
.aiBubble.loading{color:var(--muted)}
.aiBubble.loading:after{content:"";display:inline-block;width:6px;height:6px;margin-left:7px;border-radius:50%;background:#7c4dff;box-shadow:10px 0 #9b8af4,20px 0 #c3b9fa;animation:typing 1s infinite}
@keyframes typing{0%,100%{opacity:.35}50%{opacity:1}}
.aiRouteCard{
  align-self:flex-start;width:92%;padding:14px;border-radius:19px;
  background:linear-gradient(135deg,rgba(240,243,255,.92),rgba(249,245,255,.92));
  border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow)
}
.aiRouteCard .routeHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aiRouteCard b{font-size:13px}.aiRouteCard small{color:var(--muted);font-size:10px}
.aiRouteCard p{margin:7px 0 0;color:#59647b;font-size:11px;line-height:1.65}
.aiComposerWrap{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  width:min(520px,100%);z-index:45;padding:8px 12px 10px;
  background:linear-gradient(180deg,rgba(244,245,255,0),rgba(244,245,255,.90) 30%);
  backdrop-filter:blur(16px)
}
.aiComposer{
  display:flex;align-items:flex-end;gap:7px;padding:7px;
  border-radius:23px;background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.96);
  box-shadow:0 12px 35px rgba(65,75,150,.18)
}
.aiComposer textarea{
  flex:1;min-width:0;max-height:110px;min-height:42px;resize:none;
  border:0;outline:0;background:transparent;padding:10px 9px;
  color:var(--text);font-size:14px;line-height:1.45
}
.aiComposer textarea::placeholder{color:#9aa3b4}
.aiSend{
  width:43px;height:43px;flex:none;border-radius:15px;color:#fff;
  background:linear-gradient(135deg,#4f6cff,#7c4dff);
  font-size:18px;box-shadow:0 7px 18px rgba(79,108,255,.25)
}
.aiComposerTools{display:flex;gap:6px;margin-top:6px;padding-left:5px}
.aiMini{
  background:rgba(255,255,255,.58);color:#7a8498;
  border:1px solid rgba(255,255,255,.75);border-radius:10px;
  padding:5px 8px;font-size:10px
}
.aiHint{text-align:center;color:#a1a8b7;font-size:9px;margin-top:5px}
.aiError{color:#b33b4b;background:#fff1f3;border:1px solid #ffe0e5}
@media(max-width:390px){.aiBubble{max-width:91%}.aiConversation{padding-bottom:125px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="logo">旅伴</div><div class="sub">你的旅行管家</div></div><button class="circle" onclick="showPage('me')">◉</button></header>
  <main>
    <section id="home" class="page active"></section>
    <section id="trip" class="page"></section>
    <section id="cities" class="page"></section>
    <section id="food" class="page"></section>
    <section id="spots" class="page"></section>
    <section id="ai" class="page"></section>
    <section id="me" class="page"></section>
  </main>
</div>

<nav class="bottom">
  <button class="nav on" data-p="home" onclick="showPage('home')"><b>⌂</b>首页</button>
  <button class="nav" data-p="trip" onclick="showPage('trip')"><b>▣</b>行程</button>
  <button class="plus" onclick="openTrip()">＋</button>
  <button class="nav" data-p="ai" onclick="showPage('ai')"><b>✦</b>旅伴AI</button>
  <button class="nav" data-p="me" onclick="showPage('me')"><b>◎</b>我的</button>
</nav>

<div id="modal" class="modalWrap"><div class="modal"><div class="modalHead"><h2 id="modalTitle">新增</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const AI_ENDPOINT="/ai";
const state={
  trips:JSON.parse(localStorage.getItem("tm_trips")||"[]"),
  messages:JSON.parse(localStorage.getItem("tm_ai_messages")||"[]")
};
const save=()=>localStorage.setItem("tm_trips",JSON.stringify(state.trips));
const saveAI=()=>localStorage.setItem("tm_ai_messages",JSON.stringify(state.messages));
const toast=(s)=>{const x=document.getElementById("toast");x.textContent=s;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),1800)};

function showPage(id){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x.dataset.p===id));
  render(id);
  window.scrollTo({top:0,behavior:"smooth"});
}
function openModal(title,html){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.add("on")}
function closeModal(){document.getElementById("modal").classList.remove("on")}

function renderHome(){
 document.getElementById("home").innerHTML=`
  <div class="hero"><div class="heroCard"><div class="kicker">TRAVELMATE</div><h1>把旅行，安排得刚刚好</h1><p>行程、景点、美食、AI 规划，一处管理。</p></div></div>
  <div class="grid">
    <button class="entry" onclick="showPage('trip')"><b>🗓️</b><strong>我的行程</strong><span>时间轴 · 编辑 · 添加</span></button>
    <button class="entry" onclick="showPage('spots')"><b>📍</b><strong>景点</strong><span>按城市浏览与收藏</span></button>
    <button class="entry" onclick="showPage('food')"><b>🍜</b><strong>美食</strong><span>店铺 · 地址 · 导航</span></button>
    <button class="entry" onclick="showPage('ai')"><b>✦</b><strong>旅伴 AI</strong><span>规划 · 调整 · 推荐 · 问答</span></button>
  </div>
  <div class="section"><div class="sectionHead"><h3>城市探索</h3><button class="ghost" onclick="showPage('cities')">查看全部</button></div>
    <div class="card"><b>福州 · 平潭 · 泉州 · 厦门</b><p class="small">从城市灵感到具体路线，慢慢把下一次旅行拼完整。</p></div>
  </div>`;
}
function renderTrip(){
 const el=document.getElementById("trip");
 if(!state.trips.length){el.innerHTML=`<div class="section"><div class="sectionHead"><h3>我的行程</h3><button class="primary" onclick="openTrip()">＋ 添加</button></div><div class="card empty">还没有行程。<br>点击右下方 ＋，创建第一段旅行。</div></div>`;return}
 el.innerHTML=`<div class="section"><div class="sectionHead"><h3>我的行程</h3><button class="primary" onclick="openTrip()">＋ 添加</button></div>
 ${state.trips.map((t,i)=>`<div class="event"><div class="eventTime">${esc(t.time||"待定")}</div><div class="eventTitle">${esc(t.title)}</div><div class="eventAddr">${esc(t.city||"")}${t.note?" · "+esc(t.note):""}</div><div class="actions"><button onclick="editTrip(${i})">编辑</button><button onclick="deleteTrip(${i})">删除</button></div></div>`).join("")}</div>`;
}
function openTrip(i=null){
 const t=i===null?{}:state.trips[i];
 openModal(i===null?"添加行程":"编辑行程",`<div class="form">
 <label>日期 / 时间<input id="fTime" value="${esc(t.time||"")}" placeholder="例如：9月30日 09:00"></label>
 <label>城市<input id="fCity" value="${esc(t.city||"")}" placeholder="例如：平潭"></label>
 <label>事项<input id="fTitle" value="${esc(t.title||"")}" placeholder="例如：北线环岛"></label>
 <label>备注<textarea id="fNote" placeholder="交通、门票、集合点等">${esc(t.note||"")}</textarea></label>
 <div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="saveTrip(${i===null?"null":i})">保存</button></div></div>`);
}
function saveTrip(i){const t={time:fTime.value,city:fCity.value,title:fTitle.value,note:fNote.value};if(!t.title){toast("请先填写事项");return}if(i===null)state.trips.push(t);else state.trips[i]=t;save();closeModal();renderTrip();toast("行程已保存")}
function editTrip(i){openTrip(i)}function deleteTrip(i){if(confirm("删除这条行程？")){state.trips.splice(i,1);save();renderTrip();toast("已删除")}}

const spots=[
 ["福州","三坊七巷","历史街区 · 人文漫步","🏮"],["平潭","龙王头沙滩","看海 · 日落 · 环岛","🌊"],
 ["泉州","西街","古城 · 小吃 · 夜游","⛩️"],["厦门","鼓浪屿","建筑 · 海岛 · 漫步","🏝️"]
];
const foods=[
 ["福州","鱼丸 / 肉燕","适合早餐或古城小吃","🍥"],["平潭","海鲜","海岛当日鲜","🦐"],
 ["泉州","面线糊","闽南早餐","🍜"],["厦门","沙茶面","厦门经典","🥣"]
];
function renderSpots(){document.getElementById("spots").innerHTML=`<div class="section"><div class="sectionHead"><h3>景点</h3></div>${spots.map(x=>`<div class="itemCard"><div class="itemTop"><div class="thumb">${x[3]}</div><div><h3>${x[1]}</h3><div class="small">${x[0]} · ${x[2]}</div></div></div><div class="itemBtns"><button onclick="toast('已复制：${x[1]}')">复制名称</button><button class="add" onclick="addQuick('${x[0]}','${x[1]}')">加入行程</button></div></div>`).join("")}</div>`}
function renderFood(){document.getElementById("food").innerHTML=`<div class="section"><div class="sectionHead"><h3>美食</h3></div>${foods.map(x=>`<div class="itemCard"><div class="itemTop"><div class="thumb">${x[3]}</div><div><h3>${x[1]}</h3><div class="small">${x[0]} · ${x[2]}</div></div></div><div class="itemBtns"><button onclick="toast('已复制：${x[1]}')">复制店铺</button><button onclick="toast('可在地图中搜索：${x[1]}')">导航</button><button class="add" onclick="addQuick('${x[0]}','${x[1]}')">加入</button></div></div>`).join("")}</div>`}
function addQuick(city,title){state.trips.push({time:"待安排",city,title,note:"来自旅伴推荐"});save();toast("已加入我的行程")}
function renderCities(){document.getElementById("cities").innerHTML=`<div class="section"><div class="sectionHead"><h3>城市探索</h3></div>${["福州","平潭","泉州","厦门"].map((c,i)=>`<div class="card" onclick="toast('正在探索 ${c}')"><b>${c}</b><p class="small">${["古城与烟台山","海岛环岛与日落","古城人文与闽南美食","海岛城市与海风散步"][i]}</p></div>`).join("")}</div>`}

function renderAI(){
  const el=document.getElementById("ai");
  const chats=state.messages.length
    ? state.messages.map(m=>`<div class="aiBubble ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`).join("")
    : `<div class="aiWelcome"><b>你好，我是旅伴 AI</b><p>你可以直接告诉我目的地、时间、预算或现有行程。我会帮你规划、调整路线、推荐景点美食，并尽量给出能直接执行的方案。</p></div>`;

  el.innerHTML=`
    <div class="aiPage">
      <div class="aiTopbar">
        <div class="aiTitle">
          <div class="aiAvatar">✦</div>
          <div><b>旅伴 AI</b><span>智能旅行规划助手</span></div>
        </div>
        <button class="aiMore" onclick="clearAI()">•••</button>
      </div>

      <div class="aiQuick">
        <button onclick="usePrompt('帮我规划一份完整旅行路线')">🧭 规划路线</button>
        <button onclick="usePrompt('根据我现在的行程，帮我重新优化时间和顺序')">✨ 优化行程</button>
        <button onclick="usePrompt('推荐附近值得去的景点和本地美食')">📍 景点美食</button>
        <button onclick="usePrompt('如果遇到下雨，帮我调整今天的行程')">☔ 雨天方案</button>
      </div>

      <div id="chat" class="aiConversation">${chats}</div>

      <div class="aiComposerWrap">
        <div class="aiComposer">
          <textarea id="aiInput" rows="1" placeholder="输入你想让旅伴帮你做的事…"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI()}"></textarea>
          <button class="aiSend" onclick="sendAI()" aria-label="发送">↑</button>
        </div>
        <div class="aiComposerTools">
          <button class="aiMini" onclick="usePrompt('帮我看看当前行程哪里不合理')">优化当前行程</button>
          <button class="aiMini" onclick="usePrompt('帮我推荐一顿当地特色美食')">推荐美食</button>
          <button class="aiMini" onclick="usePrompt('帮我安排一个半天的轻松路线')">半日路线</button>
        </div>
        <div class="aiHint">旅伴 AI 会结合你当前保存的行程来回答</div>
      </div>
    </div>`;

  const input=document.getElementById("aiInput");
  if(input){
    input.addEventListener("input",()=>{
      input.style.height="42px";
      input.style.height=Math.min(input.scrollHeight,110)+"px";
    });
  }
}

function usePrompt(s){
  const i=document.getElementById("aiInput");
  if(i){i.value=s;i.focus();i.dispatchEvent(new Event("input"));return}
  showPage("ai");
  setTimeout(()=>{
    const x=document.getElementById("aiInput");
    if(x){x.value=s;x.focus();x.dispatchEvent(new Event("input"))}
  },80);
}

function clearAI(){
  if(!state.messages.length){toast("还没有聊天记录");return}
  if(confirm("清空旅伴 AI 的聊天记录？")){
    state.messages=[];saveAI();renderAI();toast("聊天记录已清空");
  }
}

async function sendAI(){
  const input=document.getElementById("aiInput");
  const text=(input?.value||"").trim();
  if(!text)return;

  state.messages.push({role:"user",content:text});
  saveAI();
  renderAI();

  const chat=document.getElementById("chat");
  if(chat){
    chat.insertAdjacentHTML("beforeend",`<div class="aiBubble assistant loading">正在整理你的旅行方案</div>`);
    requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}));
  }

  try{
    const tripContext=state.trips.length
      ? `\n\n【用户当前已保存的行程】\n${JSON.stringify(state.trips,null,2)}`
      : "\n\n【用户当前已保存的行程】暂无";

    const system=`你是“旅伴旅行管家”的旅行 AI。
你的任务是像一个真正的旅行规划助手一样解决问题，不要只给泛泛建议。
回答优先结合用户当前行程；如果用户要求优化路线，要明确指出调整前后的顺序、时间和原因。
如果信息不足，可以先给合理方案并说明需要补充什么。
涉及路线时尽量给出：时间、地点、交通方式、预计耗时、餐饮/景点建议、注意事项。
回答简洁但要有实质内容，适合手机阅读。
不要讨论 Worker、Cloudflare、API Key、接口、后台配置等技术内容。
不要使用“爸爸”等聊天称呼。${tripContext}`;

    const messages=[{role:"system",content:system}].concat(state.messages.slice(-14));
    const res=await fetch(AI_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages,temperature:.65})
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"AI 请求失败");

    const answer=data?.choices?.[0]?.message?.content
      ||data?.output?.choices?.[0]?.message?.content
      ||"AI 暂时没有返回内容。";

    state.messages.push({role:"assistant",content:answer});
    saveAI();
    renderAI();
    requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}));
  }catch(e){
    state.messages.push({role:"assistant",content:"暂时没能完成这次请求，请稍后再试。"});
    saveAI();
    renderAI();
    toast(e.message||"AI 请求失败");
  }
}
function renderMe(){document.getElementById("me").innerHTML=`<div class="section"><div class="sectionHead"><h3>我的</h3></div><div class="card"><b>本地数据</b><p class="small">行程和 AI 对话默认保存在当前设备，不需要注册即可使用。</p></div><div class="card"><b>当前版本</b><p class="small">旅伴旅行管家 · AI 接入版</p></div><button class="danger" onclick="localStorage.clear();location.reload()">清空本机数据</button></div>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(id){({home:renderHome,trip:renderTrip,cities:renderCities,food:renderFood,spots:renderSpots,ai:renderAI,me:renderMe}[id]||renderHome)()}
renderHome();
</script>
</body>
</html>
