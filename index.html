function tripCard(t){
 const extra=t.preset
   ? `<span class="tag">预置</span>`
   : `<span class="tag">自建</span>`;
 const buttons=t.preset
   ? `<button onclick="openTrip('${t.id}')">打开行程</button>`
   : `<button onclick="openTrip('${t.id}')">打开行程</button><button onclick="editTripMeta('${t.id}')">编辑</button><button class="danger" onclick="deleteTrip('${t.id}')">删除</button>`;
 return `<div class="tripCard"><h3>${esc(t.name)}</h3><div class="small">${esc(t.desc||"")}</div><div class="tripMeta"><span class="tag">${fmtDate(t.start)}—${fmtDate(t.end)}</span><span class="tag">${daysBetween(t.start,t.end)}天</span>${extra}</div><div class="actions">${buttons}</div></div>`;
}

 ${t.days[activeDay].events.length?t.days[activeDay].events.map((e,i)=>eventHTML(e,i,activeDay)).join(""):`<div class="card empty">这是一个真正的空白日程。<br>点击「＋ 添加」开始添加时间、地点和交通。</div>`}</div></main>`;
}
function eventHTML(e,i,di){return `<div class="event"><div class="eventTime">${esc(e[0])}</div><div class="eventTitle">${esc(e[1])}</div><div class="eventAddr">${esc(e[2]||"")}${e[3]?`<br>📍 ${esc(e[3])}`:""}</div><div class="actions"><button onclick="copyText('${esc(e[3]||e[1])}')">复制地址</button><button onclick="navigateTo('${esc(e[3]||e[1])}')">导航</button><button onclick="openEvent(${di},${i})">编辑</button><button class="danger" onclick="deleteEvent(${di},${i})">删除</button></div></div>`}
function renderCities(){
 document.getElementById("cities").innerHTML=`<div class="top"><div><div class="logo">城市探索</div><div class="sub">一级类目 · 新建城市后立即拥有独立内容空间</div></div><button class="circle" onclick="openCity()">＋</button></div><main><div class="pills">${db.cities.map(c=>`<button class="pill ${currentCity===c.name?'on':''}" onclick="currentCity='${esc(c.name)}';renderCities()">${esc(c.name)}</button>`).join("")}</div>${db.cities.map(c=>{let cd=cityData(c.name);return `<div class="citycard"><h3>${esc(c.name)}</h3><p class="small">${esc(c.desc)}</p><div class="tripMeta"><span class="tag">${cd.spots.length}个景点</span><span class="tag">${cd.foods.length}个美食</span></div><div class="actions"><button onclick="currentSpotCity='${esc(c.name)}';showPage('spots')">📍 景点</button><button onclick="currentFoodCity='${esc(c.name)}';showPage('food')">🍜 美食</button><button onclick="openCityEvent('${esc(c.name)}')">＋ 添加内容</button></div></div>`}).join("")}</main>`;
}
function renderFood(){
 let c=currentFoodCity, arr=foodExtra[c]||[];document.getElementById("food").innerHTML=`<div class="top"><div><div class="logo">美食地图</div><div class="sub">复制地址 · 导航 · 加入当前自建行程</div></div></div><main><div class="pills">${Object.keys(foodExtra).map(x=>`<button class="pill ${x===c?'on':''}" onclick="currentFoodCity='${x}';renderFood()">${x}</button>`).join("")}</div>${arr.map((x,i)=>`<div class="itemCard"><div class="itemTop"><div class="thumb">🍜</div><div><h3>${esc(x[0])}</h3><div class="small">📍 ${esc(x[1])}</div><div class="price">${esc(x[2])}</div><div class="small">必点：${esc(x[3])}</div></div></div><div class="itemBtns"><button onclick="copyText('${esc(x[1])}')">复制地址</button><button onclick="navigateTo('${esc(x[1])}')">导航</button><button class="add" onclick="addToTrip('${esc(x[0])}','${esc(x[1])}','美食')">＋加入行程</button></div></div>`).join("")}</main>`;
}
function renderSpots(){
 let c=currentSpotCity, arr=spotExtra[c]||[];document.getElementById("spots").innerHTML=`<div class="top"><div><div class="logo">景点探索</div><div class="sub">按城市浏览 · 加入你的自建行程</div></div></div><main><div class="pills">${Object.keys(spotExtra).map(x=>`<button class="pill ${x===c?'on':''}" onclick="currentSpotCity='${x}';renderSpots()">${x}</button>`).join("")}</div>${arr.map((x,i)=>`<div class="itemCard"><div class="itemTop"><div class="thumb">📍</div><div><h3>${esc(x[0])}</h3><div class="small">📍 ${esc(x[1])}</div><div class="price">${esc(x[2])}</div><div class="small">亮点：${esc(x[3])}</div></div></div><div class="itemBtns"><button onclick="copyText('${esc(x[1])}')">复制地址</button><button onclick="navigateTo('${esc(x[1])}')">导航</button><button class="add" onclick="addToTrip('${esc(x[0])}','${esc(x[1])}','景点')">＋加入行程</button></div></div>`).join("")}</main>`;
}
function renderAI(){
 document.getElementById("ai").innerHTML=`<div class="top"><div><div class="logo">旅伴 AI</div><div class="sub">你的私人旅行助手</div></div></div>
 <main>
  <div class="aiHero"><div class="aiHeroCard"><div class="kicker">TRAVELMATE AI</div><h1>让旅行规划<br>变得更简单</h1><p>规划 · 调整 · 推荐 · 问答</p></div></div>
  <div class="aiStatus"><span class="aiDot"></span><span>AI 助手已准备好</span></div>
  <div class="aiTools">
   <button class="aiTool" onclick="useAIPrompt('帮我优化当前行程，减少赶路并重新安排时间')"><b>🗺️</b><span>优化行程</span><small>重新安排路线与时间</small></button>
   <button class="aiTool" onclick="useAIPrompt('根据当前行程推荐附近值得吃的美食')"><b>🍜</b><span>推荐美食</span><small>按位置和时间推荐</small></button>
   <button class="aiTool" onclick="useAIPrompt('根据当前行程推荐值得去的景点')"><b>📍</b><span>发现景点</span><small>找适合当前路线的地方</small></button>
   <button class="aiTool" onclick="useAIPrompt('帮我检查当前行程有没有时间冲突')"><b>⏱️</b><span>检查时间</span><small>发现冲突并给出调整方案</small></button>
  </div>
  <div class="aiPromptRow">
   <button class="aiPrompt" onclick="useAIPrompt('帮我把今天的路线安排得更轻松')">轻松一点</button>
   <button class="aiPrompt" onclick="useAIPrompt('给我推荐一条拍照好看的路线')">拍照路线</button>
   <button class="aiPrompt" onclick="useAIPrompt('帮我找附近性价比高的美食')">性价比美食</button>
   <button class="aiPrompt" onclick="useAIPrompt('帮我检查交通衔接是否合理')">检查交通</button>
  </div>
  <div id="chat"><div class="bubble"><b>旅伴 AI</b><br>你好，我可以直接结合你的行程帮你规划。你可以告诉我想去哪里、想吃什么，或者让我帮你调整整天路线。</div></div>
  <div class="aiComposer"><div class="aiComposerBox"><input id="aiQ" placeholder="告诉我你想怎么规划这次旅行"><button class="primary" onclick="askAI()">发送</button></div></div>
 </main>`;
}
function useAIPrompt(text){let q=document.getElementById("aiQ");if(q){q.value=text;q.focus()}else{showPage("ai");setTimeout(()=>{let x=document.getElementById("aiQ");if(x){x.value=text;x.focus()}},80)}}
async function askAI(){
 let q=document.getElementById("aiQ").value.trim();if(!q)return;
 let chat=document.getElementById("chat");chat.innerHTML+=`<div class="bubble me">${esc(q)}</div>`;document.getElementById("aiQ").value="";document.getElementById("aiQ").blur();
 let t=tripById(activeTripId);let payload={model:"",messages:[{role:"system",content:"你是旅伴旅行管家。优先根据用户当前行程、城市、景点、美食数据回答。给出可执行的时间、交通、地点和调整建议。不要编造用户没有提供的具体票价。"} ,{role:"user",content:`用户问题：${q}\n当前行程：${JSON.stringify(t)}`}]};
 try{let r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});let d=await r.json();let out=d?.choices?.[0]?.message?.content||d?.output?.choices?.[0]?.message?.content||d?.answer||"AI 已收到，但后台没有返回可显示内容。";chat.innerHTML+=`<div class="bubble"><b>旅伴 AI</b><br>${esc(out).replace(/\n/g,"<br>")}</div>`}
 catch(e){chat.innerHTML+=`<div class="bubble"><b>AI 暂时没有回应，请稍后再试。</div>`}
}
function renderMe(){document.getElementById("me").innerHTML=`<div class="top"><div><div class="logo">我的</div><div class="sub">数据保存在当前设备浏览器</div></div></div><main><div class="card"><h3>旅伴旅行管家</h3><p class="small">A/B 福建方案属于预置内容；你新建的城市和大行程都是独立数据，不会污染预置方案。</p></div><div class="card"><b>当前数据</b><p class="small">自建行程：${db.trips.filter(t=>!t.preset).length} 个<br>城市：${db.cities.length} 个</p><button class="ghost" onclick="exportData()">导出本地数据</button></div></main>`}
function openNewTrip(){
 document.getElementById("modalTitle").textContent="新建大行程";document.getElementById("modalBody").innerHTML=`<div class="notice">这里创建的是全新的空白行程，不会复制方案 A/B，也不会自动带入任何旧行程内容。</div><div class="form">
 <label>行程名称<input id="fName" placeholder="例如：日本关西自由行"></label>
 <div class="row"><label>开始日期<input id="fStart" type="date"></label><label>结束日期<input id="fEnd" type="date"></label></div>
 <label>出发时间<input id="fTime" type="time" value="09:00"></label>
 <label>行程简介<textarea id="fDesc" rows="3" placeholder="例如：大阪 + 京都 轻松旅行"></textarea></label>
 </div><div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="createTrip()">创建空白行程</button></div>`;
 document.getElementById("modalWrap").classList.add("on");
}
function createTrip(){
 let n=document.getElementById("fName").value.trim(),s=document.getElementById("fStart").value,e=document.getElementById("fEnd").value,d=document.getElementById("fDesc").value.trim();if(!n||!s||!e)return toast("请填写名称和开始/结束日期");if(e<s)return toast("结束日期不能早于开始日期");
 let days=[];for(let dt=new Date(s+"T00:00:00");dt<=new Date(e+"T00:00:00");dt.setDate(dt.getDate()+1)){let x=new Date(dt),date=x.toISOString().slice(0,10);days.push({date,title:"第"+(days.length+1)+"天",events:[]})}
 let t={id:"trip_"+Date.now(),preset:false,name:n,start:s,end:e,startTime:document.getElementById("fTime").value,desc:d,days};db.trips.push(t);activeTripId=t.id;activeDay=0;save();closeModal();toast("✓ 空白行程创建成功");renderTripDetail();
}
function editTripMeta(id){
 let t=tripById(id);if(!t||t.preset)return;
 document.getElementById("modalTitle").textContent="编辑行程基本信息";document.getElementById("modalBody").innerHTML=`<div class="form"><label>行程名称<input id="eName" value="${esc(t.name)}"></label><div class="row"><label>开始日期<input id="eStart" type="date" value="${t.start}"></label><label>结束日期<input id="eEnd" type="date" value="${t.end}"></label></div><label>出发时间<input id="eTime" type="time" value="${t.startTime||"09:00"}"></label><label>简介<textarea id="eDesc" rows="3">${esc(t.desc||"")}</textarea></label></div><div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="saveTripMeta('${id}')">保存</button></div>`;document.getElementById("modalWrap").classList.add("on");
}
function saveTripMeta(id){
 let t=tripById(id),n=document.getElementById("eName").value.trim(),s=document.getElementById("eStart").value,e=document.getElementById("eEnd").value;if(!n||!s||!e)return toast("资料不完整");if(e<s)return toast("结束日期不能早于开始日期");
 t.name=n;t.start=s;t.end=e;t.startTime=document.getElementById("eTime").value;t.desc=document.getElementById("eDesc").value.trim();
 let old={};t.days.forEach(x=>old[x.date]=x);let days=[];for(let dt=new Date(s+"T00:00:00");dt<=new Date(e+"T00:00:00");dt.setDate(dt.getDate()+1)){let date=new Date(dt).toISOString().slice(0,10);days.push(old[date]||{date,title:"第"+(days.length+1)+"天",events:[]})}t.days=days;save();closeModal();toast("✓ 行程已保存");renderTripDetail();
}
function openEvent(di,i=null){
 let t=tripById(activeTripId),e=i===null?null:t.days[di].events[i];
 document.getElementById("modalTitle").textContent=e?"编辑行程节点":"添加行程节点";
 document.getElementById("modalBody").innerHTML=`<div class="form"><label>日期<input type="date" id="evDate" value="${e?t.days[di].date:t.days[di].date}"></label><div class="row"><label>开始时间<input type="time" id="evStart" value="${e?(e[0].split("–")[0].trim()):"09:00"}"></label><label>结束时间<input type="time" id="evEnd" value="${e&&e[0].includes("–")?e[0].split("–")[1].trim():"10:00"}"></label></div><label>行程名称<input id="evName" value="${e?esc(e[1]):""}" placeholder="例如：三坊七巷"></label><label>交通 / 备注<input id="evNote" value="${e?esc(e[2]):""}" placeholder="例如：步行、网约车"></label><label>地址 / 地点<input id="evAddr" value="${e?esc(e[3]||""):""}" placeholder="例如：福州市鼓楼区南后街"></label></div><div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="saveEvent(${di},${i===null?"null":i})">保存</button></div>`;
 document.getElementById("modalWrap").classList.add("on");
}
function saveEvent(di,i){
 let t=tripById(activeTripId),date=document.getElementById("evDate").value,s=document.getElementById("evStart").value,e=document.getElementById("evEnd").value,n=document.getElementById("evName").value.trim(),note=document.getElementById("evNote").value.trim(),addr=document.getElementById("evAddr").value.trim();if(!date||!s||!n)return toast("日期、开始时间、名称不能为空");
 let target=t.days.find(x=>x.date===date);if(!target){target={date,title:"自定义日期",events:[]};t.days.push(target);t.days.sort((a,b)=>a.date.localeCompare(b.date))}
 let item=[e?`${s}–${e}`:s,n,note,addr];
 if(i===null)target.events.push(item);else{let oldDate=t.days[di];if(oldDate.date===date)oldDate.events[i]=item;else{oldDate.events.splice(i,1);target.events.push(item)}}
 target.events.sort((a,b)=>a[0].localeCompare(b[0]));activeDay=t.days.indexOf(target);save();closeModal();toast("✓ 行程已保存");renderTripDetail();
}
function deleteEvent(di,i){let t=tripById(activeTripId);if(!confirm("确定删除这个行程节点吗？"))return;t.days[di].events.splice(i,1);save();renderTripDetail();toast("✓ 已删除")}
function deleteTrip(id){if(!confirm("确定删除这个自建行程吗？"))return;db.trips=db.trips.filter(t=>t.id!==id);if(activeTripId===id)activeTripId=db.trips.find(t=>t.preset)?.id||"";save();renderTrip();toast("✓ 已删除")}
function openCity(){
 document.getElementById("modalTitle").textContent="新建城市（一级类目）";document.getElementById("modalBody").innerHTML=`<div class="notice">新城市不是空壳按钮，创建后会立即拥有独立的「景点」「美食」数据空间，还可以继续添加内容。</div><div class="form"><label>城市名称<input id="cName" placeholder="例如：京都"></label><label>城市简介<textarea id="cDesc" rows="3" placeholder="例如：古寺、街巷、抹茶与秋色"></textarea></label></div><div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="createCity()">创建城市</button></div>`;document.getElementById("modalWrap").classList.add("on");
}
function createCity(){let n=document.getElementById("cName").value.trim(),d=document.getElementById("cDesc").value.trim();if(!n)return toast("请输入城市名称");if(db.cities.some(c=>c.name===n))return toast("城市已存在");db.cities.push({id:"city_"+Date.now(),name:n,desc:d||"新建城市，可继续添加自己的景点和美食",spots:[],foods:[]});save();closeModal();currentCity=n;toast("✓ 城市一级类目已创建");renderCities()}
function openCityEvent(c){
 document.getElementById("modalTitle").textContent=`${c} · 添加内容`;document.getElementById("modalBody").innerHTML=`<div class="form"><label>内容类型<select id="ctType"><option value="spot">景点</option><option value="food">美食</option></select></label><label>名称<input id="ctName" placeholder="例如：清水寺 / 某某拉面"></label><label>地址<input id="ctAddr" placeholder="完整地址"></label><label>价格 / 人均<input id="ctPrice" placeholder="例如：免费 / ¥30"></label><label>简介<input id="ctDesc" placeholder="亮点或必点"></label></div><div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="saveCityContent('${esc(c)}')">保存</button></div>`;document.getElementById("modalWrap").classList.add("on");
}
function saveCityContent(c){let city=cityData(c),type=document.getElementById("ctType").value,n=document.getElementById("ctName").value.trim(),a=document.getElementById("ctAddr").value.trim(),p=document.getElementById("ctPrice").value.trim(),d=document.getElementById("ctDesc").value.trim();if(!n)return toast("请输入名称");if(type==="spot"){city.spots.push(n);spotExtra[c]=spotExtra[c]||[];spotExtra[c].push([n,a,p,d])}else{city.foods.push(n);foodExtra[c]=foodExtra[c]||[];foodExtra[c].push([n,a,p,d])}save();closeModal();toast("✓ 内容已加入城市");renderCities()}
function addToTrip(name,addr,type){
 const mine=db.trips.filter(t=>t.preset!==true);
 if(!mine.length){toast("请先新建一个空白行程");openNewTrip();return}
 const options=mine.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
 document.getElementById("modalTitle").textContent=`加入我的行程 · ${type}`;
 document.getElementById("modalBody").innerHTML=`<div class="notice">这里只显示你自己创建的行程。方案 A / B 是只读预置内容，不会出现在这里。</div><div class="form">
 <label>选择我的行程<select id="atTrip">${options}</select></label>
 <label>日期<select id="atDay"></select></label>
 <div class="row"><label>开始时间<input type="time" id="atStart" value="12:00"></label><label>结束时间<input type="time" id="atEnd" value="13:00"></label></div>
 <label>备注<input id="atNote" placeholder="例如：午餐 / 打车前往"></label></div>
 <div class="formBtns"><button class="ghost" onclick="closeModal()">取消</button><button class="primary" onclick="confirmAdd('${esc(name)}','${esc(addr)}','${esc(type)}')">加入</button></div>`;
 document.getElementById("modalWrap").classList.add("on");
 refreshAddDays();
 document.getElementById("atTrip").onchange=refreshAddDays;
}
function refreshAddDays(){let t=tripById(document.getElementById("atTrip").value);document.getElementById("atDay").innerHTML=t.days.map((d,i)=>`<option value="${i}">${fmtDate(d.date)} · ${esc(d.title)}</option>`).join("")}
function confirmAdd(name,addr,type){let t=tripById(document.getElementById("atTrip").value),d=t.days[Number(document.getElementById("atDay").value)],s=document.getElementById("atStart").value,e=document.getElementById("atEnd").value,n=document.getElementById("atNote").value.trim();d.events.push([`${s}–${e}`,name,n||type,addr]);d.events.sort((a,b)=>a[0].localeCompare(b[0]));activeTripId=t.id;save();closeModal();toast("✓ 已加入你选择的自建行程");}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast("✓ 已复制，剪贴板里可以直接粘贴")).catch(()=>{let ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("✓ 已复制，剪贴板里可以直接粘贴")})}
function navigateTo(addr){let q=encodeURIComponent(addr);let isApple=/iPhone|iPad|Mac/i.test(navigator.userAgent);let url=isApple?`http://maps.apple.com/?q=${q}`:`https://www.google.com/maps/search/?api=1&query=${q}`;window.open(url,"_blank");toast("正在打开导航")}
function closeModal(){document.getElementById("modalWrap").classList.remove("on")}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="travelmate-data.json";a.click();toast("✓ 数据已导出")}
renderHome();
</script>
</body>
