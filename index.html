function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.page===id));if(id==='home')renderHome();if(id==='trips')renderTrips();if(id==='spots')renderSpots();if(id==='food')renderFoods();if(id==='hotels')renderHotels();if(id==='transport')renderTransport();window.scrollTo({top:0,behavior:'smooth'})}
function renderHome(){document.getElementById('homeSpots').innerHTML=db.spots.slice(0,8).map(x=>dataCard(x,'spot')).join('');document.getElementById('homeFoods').innerHTML=db.foods.slice(0,8).map(x=>dataCard(x,'food')).join('')}
function renderTrips(){document.getElementById('tripList').innerHTML=db.trips.map(t=>`<button class="trip-card ${t.id===activeTrip?'active':''}" onclick="selectTrip('${t.id}')"><strong>${t.name}</strong><small>${t.city}<br>${t.start} → ${t.end}</small></button>`).join('')+`<button class="trip-card" onclick="openNewTrip()"><strong>＋ 新建行程</strong><small>自动按日期生成 DAY</small></button>`;renderTripDetail()}
function selectTrip(id){activeTrip=id;activePlan=currentTrip().plans[0].id;activeDay=0;renderTrips()}
function renderTripDetail(){const t=currentTrip(),p=currentPlan();document.getElementById('tripDetail').innerHTML=`<div class="scheme-head"><div><div class="crumb">我的行程 / <b>${t.name}</b> / ${p.name}</div><div class="scheme-name">${t.name}</div><div class="sub">${t.city} · ${t.people||1}人</div></div><div class="actions"><button class="mini" onclick="openPlanEditor()">方案管理</button><button class="mini primary" onclick="openDayEditor()">＋ 添加日程</button></div></div><div class="tabs" style="margin-top:10px">${t.plans.map(x=>`<button class="tab ${x.id===activePlan?'on':''}" onclick="switchPlan('${x.id}')">方案 ${x.id}</button>`).join('')}<button class="tab" onclick="newPlan()">＋ 新方案</button></div><div class="day-tabs">${p.days.map((d,i)=>`<button class="day-tab ${i===activeDay?'on':''}" onclick="activeDay=${i};renderTripDetail()"><b>${d.label}</b><small>${d.date}</small></button>`).join('')}</div><div class="card glass"><div class="crumb">${p.days[activeDay].date}</div><h3>${p.days[activeDay].title}</h3><div class="sub">每日独立编辑 · 景点、美食、酒店、火车、航班、交通、备注</div></div><div class="timeline">${p.days[activeDay].items.length?p.days[activeDay].items.map((it,i)=>itCard(it,i)).join(''):`<div class="empty glass">今天还没有详细日程<br><button class="mini primary" style="margin-top:10px" onclick="openDayEditor()">＋ 添加第一条</button></div>`}</div><div class="day-footer"><span class="budget">当天预算：¥${p.days[activeDay].items.reduce((s,x)=>s+Number(x.budget||0),0)}</span><button class="mini primary" onclick="openDayEditor()">＋ 添加</button></div>`}
function switchPlan(id){activePlan=id;activeDay=0;renderTripDetail()}function itCard(it,i){return `<div class="it-card glass"><div class="it-time">${it.time||'未定时间'} <span class="it-type">${it.type||'备注'}</span></div><div class="it-title">${it.name}</div><div class="it-address">📍 ${it.address||'暂无地址'}</div><div class="actions"><button class="mini" onclick="copyText('${esc(it.name)}')">复制名称</button><button class="mini" onclick="copyText('${esc(it.address||'')}')">复制地址</button><button class="mini" onclick="navTo('${esc(it.name)}','${esc(it.address||'')}','${esc(it.city||'')}')">导航</button><button class="mini" onclick="openItemEditor(${i})">编辑</button><button class="mini danger" onclick="deleteItem(${i})">删除</button></div></div>`}
function openNewTrip(){openModal(`<h2>新建行程</h2><label>行程名称</label><input id="fName" placeholder="例如：日本大阪"><label>开始日期</label><input id="fStart" type="date"><label>结束日期</label><input id="fEnd" type="date"><label>城市</label><input id="fCity" placeholder="例如：大阪 / 京都"><label>人数</label><input id="fPeople" type="number" value="2" min="1"><label>标签</label><input id="fTags" placeholder="旅行、周末、国庆"><div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="createTrip()">创建行程</button></div>`)}
function createTrip(){const s=document.getElementById('fStart').value,e=document.getElementById('fEnd').value,n=document.getElementById('fName').value.trim();if(!n||!s||!e||e<s)return toast('请填写正确的名称和日期');const days=[];for(let d=new Date(s);d<=new Date(e);d.setDate(d.getDate()+1))days.push({id:uid(),label:'DAY '+days.length,date:(d.getMonth()+1)+'月'+d.getDate()+'日',title:'待规划',items:[]});const t={id:uid(),name:n,start:s,end:e,city:document.getElementById('fCity').value,people:Number(document.getElementById('fPeople').value||1),tags:document.getElementById('fTags').value.split(/[,，]/).filter(Boolean),plans:[{id:'A',name:'方案A',days}]};db.trips.push(t);activeTrip=t.id;activePlan='A';activeDay=0;save();closeModal();go('trips');toast('行程已创建')}
function openPlanEditor(){const t=currentTrip();openModal(`<h2>方案管理</h2>${t.plans.map(p=>`<div class="card" style="background:#fff"><b>${p.name}</b><div class="actions"><button class="mini" onclick="renamePlan('${p.id}')">重命名</button><button class="mini" onclick="copyPlan('${p.id}')">复制</button>${t.plans.length>1?`<button class="mini danger" onclick="removePlan('${p.id}')">删除</button>`:''}</div></div>`).join('')}<div class="actions"><button class="mini primary" onclick="newPlan()">＋ 新方案</button><button class="mini" onclick="closeModal()">关闭</button></div>`)}
function newPlan(){const t=currentTrip(),id=String.fromCharCode(65+t.plans.length),base=t.plans[0].days.map(d=>({id:uid(),label:d.label,date:d.date,title:d.title,items:[]}));t.plans.push({id,name:'方案'+id,days:base});activePlan=id;activeDay=0;save();closeModal();renderTrips()}function renamePlan(id){const n=prompt('新的方案名称');if(!n)return;currentTrip().plans.find(x=>x.id===id).name=n;save();closeModal();renderTrips()}function copyPlan(id){const p=currentTrip().plans.find(x=>x.id===id),nid=String.fromCharCode(65+currentTrip().plans.length),cp=JSON.parse(JSON.stringify(p));cp.id=nid;cp.name='方案'+nid+'（复制）';cp.days.forEach(d=>d.id=uid());currentTrip().plans.push(cp);activePlan=nid;save();closeModal();renderTrips()}function removePlan(id){currentTrip().plans=currentTrip().plans.filter(x=>x.id!==id);activePlan=currentTrip().plans[0].id;save();closeModal();renderTrips()}
function openDayEditor(){const d=currentPlan().days[activeDay];openModal(`<h2>添加日程 · ${d.date}</h2><label>时间</label><input id="iTime" type="time" value="09:00"><label>类型</label><select id="iType"><option>景点</option><option>美食</option><option>酒店</option><option>火车</option><option>航班</option><option>交通</option><option>备注</option></select><label>名称</label><input id="iName" placeholder="例如：猴研岛"><label>地址</label><input id="iAddr" placeholder="详细地址"><label>城市</label><input id="iCity" value="${currentTrip().city.split('/')[0].trim()}"><label>预算</label><input id="iBudget" type="number" value="0"><div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="addItem()">加入当天</button></div>`)}function addItem(){const d=currentPlan().days[activeDay],name=document.getElementById('iName').value.trim();if(!name)return toast('请输入名称');d.items.push({id:uid(),time:document.getElementById('iTime').value,type:document.getElementById('iType').value,name,address:document.getElementById('iAddr').value,city:document.getElementById('iCity').value,budget:Number(document.getElementById('iBudget').value||0)});d.items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));save();closeModal();renderTripDetail()}function openItemEditor(i){const it=currentPlan().days[activeDay].items[i];openModal(`<h2>编辑日程</h2><label>时间</label><input id="iTime" type="time" value="${it.time||''}"><label>类型</label><input id="iType" value="${it.type||''}"><label>名称</label><input id="iName" value="${esc(it.name)}"><label>地址</label><input id="iAddr" value="${esc(it.address||'')}"><label>预算</label><input id="iBudget" type="number" value="${it.budget||0}"><div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="saveItem(${i})">保存</button></div>`)}function saveItem(i){const d=currentPlan().days[activeDay],it=d.items[i];it.time=document.getElementById('iTime').value;it.type=document.getElementById('iType').value;it.name=document.getElementById('iName').value;it.address=document.getElementById('iAddr').value;it.budget=Number(document.getElementById('iBudget').value||0);d.items.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));save();closeModal();renderTripDetail()}function deleteItem(i){if(!confirm('删除这条日程？'))return;currentPlan().days[activeDay].items.splice(i,1);save();renderTripDetail()}
function addDataToTrip(type,id){const source=type==='spot'?db.spots:type==='food'?db.foods:type==='hotel'?db.hotels:db.transports,x=source.find(v=>v.id===id);if(!x)return;const d=currentPlan().days[activeDay];d.items.push({id:uid(),time:'09:00',type:type==='spot'?'景点':type==='food'?'美食':type==='hotel'?'酒店':'交通',name:x.name,address:x.address||'',city:x.city||'',budget:Number(x.price||0)});d.items.sort((a,b)=>a.time.localeCompare(b.time));save();go('trips');toast('已加入当前 DAY')}
function dataCard(x,type){return `<div class="data-card glass"><div class="data-top"><div><div class="city-label">${x.city}</div><h3>${x.name}</h3><div class="data-meta">📍 ${x.address}</div></div><div class="pill">${type==='food'?'¥'+(x.price||0):(x.price||'')}</div></div><div class="data-desc">${x.desc||x.highlight||x.must||''}</div><div class="data-meta">🚇 ${x.transport||''}</div><div class="data-actions"><button class="mini" onclick="copyText('${esc(x.name)}')">复制名称</button><button class="mini" onclick="copyText('${esc(x.address)}')">复制地址</button><button class="mini" onclick="navTo('${esc(x.name)}','${esc(x.address)}','${esc(x.city)}')">导航</button><button class="mini primary" onclick="addDataToTrip('${type}','${x.id}')">加入行程</button><button class="mini" onclick="toggleFavorite('${type}','${x.id}')">♡ 收藏</button></div></div>`}
function renderSpots(){document.getElementById('spotCities').innerHTML=CITIES.map(c=>`<button class="tab ${spotCity===c?'on':''}" onclick="spotCity='${c}';renderSpots()">${c}</button>`).join('');document.getElementById('spotList').innerHTML=db.spots.filter(x=>spotCity==='全部'||x.city===spotCity).map(x=>dataCard(x,'spot')).join('')}function renderFoods(){document.getElementById('foodCities').innerHTML=CITIES.map(c=>`<button class="tab ${foodCity===c?'on':''}" onclick="foodCity='${c}';renderFoods()">${c}</button>`).join('');document.getElementById('foodList').innerHTML=db.foods.filter(x=>foodCity==='全部'||x.city===foodCity).map(x=>dataCard(x,'food')).join('')}
function renderHotels(){document.getElementById('hotelList').innerHTML=db.hotels.map(x=>`<div class="data-card glass"><div class="city-label">${x.plan} · ${x.date}</div><h3>${x.name}</h3><div class="data-meta">📍 ${x.address}</div><div class="data-actions"><button class="mini" onclick="copyText('${esc(x.name)}')">复制名称</button><button class="mini" onclick="copyText('${esc(x.address)}')">复制地址</button><button class="mini" onclick="navTo('${esc(x.name)}','${esc(x.address)}','${esc(x.city)}')">导航</button><button class="mini primary" onclick="addDataToTrip('hotel','${x.id}')">加入行程</button></div></div>`).join('')}function renderTransport(){document.getElementById('transportList').innerHTML=db.transports.map(x=>`<div class="data-card glass"><div class="city-label">${x.plan} · ${x.date}</div><h3>${x.name}</h3><div class="data-meta">🚄 ${x.address} · ${x.code}</div><div class="data-actions"><button class="mini" onclick="copyText('${esc(x.name)}')">复制名称</button><button class="mini" onclick="copyText('${esc(x.address)}')">复制地址</button><button class="mini" onclick="navTo('${esc(x.address)}','','')">导航</button><button class="mini primary" onclick="addDataToTrip('transport','${x.id}')">加入行程</button></div></div>`).join('')}
function toggleFavorite(type,id){const k='lvban-fav',f=JSON.parse(localStorage.getItem(k)||'[]'),key=type+':'+id,n=f.includes(key)?f.filter(x=>x!==key):[...f,key];localStorage.setItem(k,JSON.stringify(n));toast(f.includes(key)?'已取消收藏':'已收藏')}
function openDataEditor(type){const title=type==='spot'?'新增景点':type==='food'?'新增美食':type==='hotel'?'新增酒店':'新增交通';openModal(`<h2>${title}</h2><label>名称</label><input id="dName"><label>城市</label><input id="dCity" placeholder="福州 / 平潭 / 泉州 / 厦门"><label>地址</label><input id="dAddr"><label>简介 / 推荐菜</label><textarea id="dDesc"></textarea><label>价格 / 人均</label><input id="dPrice" type="number" value="0"><label>交通</label><input id="dTrans"><div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="saveData('${type}')">保存</button></div>`)}function saveData(type){const x={id:uid(),name:document.getElementById('dName').value,city:document.getElementById('dCity').value,address:document.getElementById('dAddr').value,desc:document.getElementById('dDesc').value,price:Number(document.getElementById('dPrice').value||0),transport:document.getElementById('dTrans').value};if(!x.name||!x.address)return toast('名称和地址不能为空');if(type==='spot')db.spots.push(x);else if(type==='food')db.foods.push(x);else if(type==='hotel')db.hotels.push({...x,date:'自定义',plan:'自定义'});else db.transports.push({...x,date:'自定义',plan:'自定义',code:''});save();closeModal();type==='spot'?renderSpots():type==='food'?renderFoods():type==='hotel'?renderHotels():renderTransport();toast('已保存')}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function aiDemo(q){document.getElementById('aiResult').innerHTML=`<div class="card glass"><h3>AI：${q}</h3><p>当前版本已预留独立 AI 接口层。真实接入火山方舟后，可读取并修改行程数据。</p><button class="mini primary" onclick="go('trips')">去行程执行</button></div>`}function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lvban-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(){document.getElementById('fileInput').click()}function readImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(db,JSON.parse(r.result));save();location.reload()}catch(e){toast('JSON 无法读取')}};r.readAsText(f)}
renderHome();renderTrips();
</script>
<script src="data.js"></script>
<script src="storage.js"></script>
