bel>开始日期</label><input id="tStart" type="date"><label>结束日期</label><input id="tEnd" type="date"><label>城市 / 地区</label><input id="tCity" placeholder="福州 / 平潭 / 泉州 / 厦门"><label>方案</label><select id="tPlan"><option>方案A</option><option>方案B</option></select><button class="btn primary" onclick="saveTrip()">创建行程</button></div>`)}function saveTrip(){let t={name:tName.value,start:tStart.value,end:tEnd.value,city:tCity.value,plan:tPlan.value};if(!t.name||!t.start||!t.end)return toast('请先填写行程名称和日期');customTrips.push(t);localStorage.setItem('lvban-trips',JSON.stringify(customTrips));closeModal();go('trips');toast('行程已创建')}function deleteTrip(i){if(confirm('确定删除这个行程？')){customTrips.splice(i,1);localStorage.setItem('lvban-trips',JSON.stringify(customTrips));renderTrips();toast('已删除')}}function openCustom(i){const t=customTrips[i];modal(t.name,`<div class="card"><h2>${e(t.name)}</h2><p>${e(t.start)} → ${e(t.end)}</p><p class="muted">${e(t.city||'')}</p><button class="btn primary" onclick="closeModal()">进入行程</button></div>`)}function editCustom(i){const t=customTrips[i];modal('编辑行程',`<div class="form"><label>行程名称</label><input id="tName" value="${e(t.name)}"><label>开始日期</label><input id="tStart" type="date" value="${e(t.start)}"><label>结束日期</label><input id="tEnd" type="date" value="${e(t.end)}"><label>城市 / 地区</label><input id="tCity" value="${e(t.city||'')}"><button class="btn primary" onclick="customTrips[${i}]={name:tName.value,start:tStart.value,end:tEnd.value,city:tCity.value};localStorage.setItem('lvban-trips',JSON.stringify(customTrips));closeModal();renderTrips()">保存</button></div>`)}function modal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}async function askAI(){const input=document.getElementById('aiInput'),text=input.value.trim();if(!text)return;input.value='';const box=document.getElementById('messages');box.insertAdjacentHTML('beforeend',`<div class="msg user">${e(text)}</div>`);const pending=document.createElement('div');pending.className='msg ai';pending.textContent='正在思考…';box.appendChild(pending);try{const d=schedules[state.plan][state.day];const history=[...box.querySelectorAll('.msg')].slice(-10).map(x=>({role:x.classList.contains('user')?'user':'assistant',content:x.textContent}));const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,tripContext:{trip:'十一福建游',plan:state.plan,date:d.date,title:d.title,items:d.items}})});const j=await r.json();pending.textContent=j.reply||j.error||'AI 暂无回复'}catch(err){pending.textContent='AI 暂时无法连接，请检查 Cloudflare Functions 配置。'}box.scrollTop=box.scrollHeight}document.getElementById('aiInput').addEventListener('keydown',x=>{if(x.key==='Enter'&&!x.shiftKey){x.preventDefault();askAI()}});function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schedules,customTrips},null,2)],{type:'application/json'}));a.download='旅伴旅行管家备份.json';a.click()}renderTrips();renderSpots();renderFoods();renderHotels();renderTransport();</script></body></html>
