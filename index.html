<title>旅伴旅行管家</title>
<style>

button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.glass{background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}
header{padding:22px 18px 10px;position:sticky;top:0;z-index:10;background:rgba(247,246,255,.72);backdrop-filter:blur(20px)}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.page{display:none;padding:14px 16px}.page.active{display:block;animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{font-size:19px;margin:0}.pill{padding:7px 10px;border-radius:12px;background:#eeecff;color:#6254ed;font-size:12px}

.card{border-radius:22px;padding:15px;margin:10px 0}.row{display:flex;gap:12px;align-items:flex-start}.date{width:58px;text-align:center;background:#f0eeff;color:#6556ed;border-radius:16px;padding:9px 5px;font-weight:800}.date small{display:block;font-weight:500}.item{flex:1}.item h3{margin:0 0 5px;font-size:16px}.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.mini{padding:8px 10px;border-radius:11px;background:#f1f2f8;color:#4b4d62;font-size:12px}.primary{background:#6d5dfc;color:#fff}.danger{background:#fff0f1;color:#d54b5c}
.detail{padding:18px;border-radius:25px}.detail h2{margin-top:0}.kv{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}.kv:last-child{border-bottom:0}
.bottom{position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 20px));height:68px;border-radius:24px;display:flex;justify-content:space-around;align-items:center}.nav{background:transparent;color:#77798b;font-size:11px}.nav strong{display:block;font-size:22px;margin-bottom:2px}.nav.on{color:#6354ef}.plus{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#7667ff,#4f8cff);color:#fff;font-size:28px;box-shadow:0 10px 24px rgba(92,82,240,.3)}
.ai-wrap{height:calc(100vh - 155px);min-height:570px;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:6px 2px}.bubble{max-width:82%;padding:12px 14px;border-radius:18px;margin:9px 0;line-height:1.55;font-size:14px}.bot{background:#fff;margin-right:auto}.me{background:#6d5dfc;color:#fff;margin-left:auto}.ai-tools{display:flex;gap:7px;overflow:auto;padding:8px 0}.ai-tools button{white-space:nowrap;padding:9px 12px;border-radius:13px;background:#fff;color:#6254ed}.composer{display:flex;gap:8px;padding:10px;border-radius:22px}.composer input{flex:1;border:0;outline:0;background:transparent}.send{width:44px;height:44px;border-radius:14px;background:#6d5dfc;color:#fff}

</style>
</head>
<body>
<div class="app">
<header><div class="brand">旅伴旅行管家</div><div class="sub">把旅行，变成一场从容的体验</div></header>

<section id="home" class="page active">
<div class="hero"><h1>准备好出发了吗？</h1><p>行程、景点、美食、酒店、交通与 AI 旅行助手，都在这里。</p></div>
<div class="grid">
<button class="tile glass" onclick="go('trips')"><div class="icon">🗺️</div><b>我的行程</b><span>A / B / 自定义三套管理</span></button>
<button class="tile glass" onclick="go('spots')"><div class="icon">📍</div><b>景点探索</b><span>按城市浏览</span></button>
<button class="tile glass" onclick="go('food')"><div class="icon">🍜</div><b>美食地图</b><span>门店与必点</span></button>
<button class="tile glass" onclick="go('transport')"><div class="icon">🚄</div><b>交通</b><span>城际交通与返程</span></button>
<button class="tile glass" onclick="go('hotels')"><div class="icon">🏨</div><b>酒店</b><span>全程住宿</span></button>
<button class="tile glass" onclick="go('ai')"><div class="icon">✨</div><b>旅伴 AI</b><span>规划与智能添加</span></button>
</div>
<div class="section-title"><h2>当前旅行</h2><span class="pill">9.28–10.4</span></div>
<div class="card glass"><b>福建国庆旅行</b><p class="sub">方案 A 四城 · 方案 B 三城</p><div class="actions"><button class="mini primary" onclick="go('trips')">进入行程</button><button class="mini" onclick="go('transport')">查看交通</button></div></div>
</section>

<section id="trips" class="page">
<div class="section-title">
  <div>
    <div class="sub" onclick="go('home')" style="cursor:pointer">‹ 返回首页</div>
    <h2>我的行程</h2>
  </div>
  <button class="mini primary" onclick="openTripEditor()">＋ 新建大行程</button>
</div>
<div class="tabs">
  <button class="on" onclick="tripTab('A',this)">方案 A</button>
  <button onclick="tripTab('B',this)">方案 B</button>
  <button onclick="tripTab('custom',this)">我的行程</button>
</div>
<div id="tripContent"></div>
</section>

<section id="spots" class="page"><div class="section-title"><h2>景点探索</h2><button class="mini primary" onclick="openAIAdd('景点')">AI 添加</button></div><div class="tabs" id="citySpotTabs"></div><div id="spotList"></div></section>
<section id="food" class="page"><div class="section-title"><h2>美食地图</h2><button class="mini primary" onclick="openAIAdd('美食')">AI 添加</button></div><div class="tabs" id="cityFoodTabs"></div><div id="foodList"></div></section>
<section id="transport" class="page"><div class="section-title"><h2>交通</h2><span class="pill">A / B</span></div><div id="transportList"></div></section>
<section id="hotels" class="page"><div class="section-title"><h2>酒店</h2><button class="mini primary" onclick="openAIAdd('酒店')">AI 添加</button></div><div id="hotelList"></div></section>

<section id="ai" class="page">
<div class="ai-wrap">
<div class="section-title"><h2>旅伴 AI</h2><span class="pill">智能旅行助手</span></div>
<div class="ai-tools"><button onclick="quickAI('帮我检查当前行程有没有时间冲突')">冲突检测</button><button onclick="quickAI('帮我优化当前路线，减少折返')">自动优化路线</button><button onclick="quickAI('帮我添加一个景点')">添加景点</button><button onclick="quickAI('帮我添加一家美食')">添加美食</button><button onclick="quickAI('帮我添加一家酒店')">添加酒店</button></div>
<div class="chat" id="chat"><div class="bubble bot">你好，我是你的旅伴 AI。你可以让我规划、编辑、检查或补充旅行内容。</div></div>
<div class="composer glass"><input id="aiInput" placeholder="输入你的旅行问题……" onkeydown="if(event.key==='Enter')sendAI()"><button class="send" onclick="sendAI()">↑</button></div>
</div>
</section>

<section id="mine" class="page">
<div class="hero"><h1>我的</h1><p>旅行数据保存在当前设备中。</p></div>
<button class="list-btn" onclick="openNewTrip()">＋ 新建大行程</button>
<button class="list-btn" onclick="go('trips')">🗺️ 管理我的行程</button>
<button class="list-btn" onclick="clearLocal()">清空本地新增数据</button>
</section>

<nav class="bottom glass">
<button class="nav on" data-page="home" onclick="go('home')"><strong>⌂</strong>首页</button>
<button class="nav" data-page="trips" onclick="go('trips')"><strong>☷</strong>行程</button>
<button class="plus" onclick="openNewTrip()">＋</button>
<button class="nav" data-page="ai" onclick="go('ai')"><strong>✦</strong>旅伴AI</button>
<button class="nav" data-page="mine" onclick="go('mine')"><strong>●</strong>我的</button>
</nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet glass" id="sheet"></div></div>

function tripTab(t,el){
  route=t;
  document.querySelectorAll('#trips .tabs button').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  renderTrips();
}
function renderTrips(){
  ensureCustomTrips();
  let title='',desc='',html='';
  if(route==='A'){
    title='福建四城完整方案'; desc='福州 → 平潭 → 泉州 → 厦门';
    html=baseTrips.A.map((x,i)=>level2Card(x[0],x[1],x[2],`A-${i}`)).join('');
    html+=aiTripBar('A');
  }else if(route==='B'){
    title='福建三城休闲方案'; desc='福州 → 平潭 → 厦门';
    html=baseTrips.B.map((x,i)=>level2Card(x[0],x[1],x[2],`B-${i}`)).join('');
    html+=aiTripBar('B');
  }else{
    title='我的行程'; desc='你创建的大行程，以及大行程下面的目的地 / 地方';
    if(!customTrips.length){
      html=`<div class="empty glass">
        <div style="font-size:42px;margin-bottom:10px">🧳</div>
        <b>还没有大行程</b>
        <p class="sub">先创建一个总行程，再在里面添加城市、目的地和每天安排。</p>
        <button class="mini primary" onclick="openTripEditor()">＋ 创建大行程</button>
      </div>`;
    }else{
      html=customTrips.map((t,i)=>level1Card(t,i)).join('');
    }
  }
  document.getElementById('tripContent').innerHTML=
    `<div class="card glass route" style="margin-bottom:14px">
      <span class="badge">${route==='custom'?'我的':route}</span>
      <div><b>${escapeHTML(title)}</b><small>${escapeHTML(desc)}</small></div>
    </div>${html}`;
}
function level1Card(t,i){
  const places=t.places||[];
  return `<div class="card glass" style="border-radius:26px;padding:18px;margin-bottom:14px">
    <div class="row">
      <div class="date">总行程<small>${places.length}个地方</small></div>
      <div class="item">
        <h3 style="font-size:18px">${escapeHTML(t.title)}</h3>
        <p>${escapeHTML(t.start||'')} ${t.end?'→ '+escapeHTML(t.end):''}</p>
        <p>${escapeHTML(t.note||'还没有行程说明')}</p>
        <div class="actions">
          <button class="mini primary" onclick="openPlaceEditor(${i})">＋ 添加二级地方</button>
          <button class="mini" onclick="aiAddPlace(${i})">✦ AI 添加地方</button>
          <button class="mini" onclick="editLevel1(${i})">编辑总行程</button>
          <button class="mini danger" onclick="deleteLevel1(${i})">删除</button>
        </div>
      </div>
    </div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      ${places.length?places.map((p,j)=>level2CustomCard(i,j,p)).join(''):`<div class="empty" style="padding:18px 5px">还没有二级地方<br><span class="sub">可以自己创建，也可以让 AI 添加</span></div>`}
    </div>
  </div>`;
}
function level2CustomCard(ti,pi,p){
  const items=Array.isArray(p.items)?p.items:[];
  return `<div class="list-btn" style="margin:8px 0;background:rgba(246,246,255,.8)" onclick="openPlaceDetail(${ti},${pi})">
    <div class="row">
      <div class="date" style="width:52px">${escapeHTML(p.date||'地方')}<small>二级</small></div>
      <div class="item">
        <b>${escapeHTML(p.title||'未命名地方')}</b>
        <p>${escapeHTML(p.note||'')}</p>
        <div class="actions">
          <button class="mini primary" onclick="event.stopPropagation();openItemEditor(${ti},${pi})">＋ 加行程</button>
          <button class="mini" onclick="event.stopPropagation();aiAddItem(${ti},${pi})">✦ AI 添加</button>
          <button class="mini" onclick="event.stopPropagation();openPlaceEditor(${ti},${pi})">编辑</button>
        </div>
        ${items.length?`<div style="margin-top:8px">${items.map((it,k)=>`<div class="kv"><b>${escapeHTML(it.time||'')}</b> ${escapeHTML(it.title||'')}<br><span class="sub">${escapeHTML(it.note||'')}</span></div>`).join('')}</div>`:''}
      </div>
    </div>
  </div>`;
}
function level2Card(date,title,desc,id){
  return `<div class="card glass" style="border-radius:22px;margin:10px 0">
    <div class="row">
      <div class="date">${escapeHTML(date)}<small>${route}路线</small></div>
      <div class="item">
        <h3>${escapeHTML(title)}</h3><p>${escapeHTML(desc)}</p>
        <div class="actions">
          <button class="mini primary" onclick="openFixedDetail('${id}')">查看二级详情</button>
          <button class="mini" onclick="quickAI('请优化${escapeAttr(title)}这一天的安排并检查时间冲突')">AI 优化</button>
        </div>
      </div>
    </div>
  </div>`;
}
function aiTripBar(r){
  return `<div class="card glass"><b>✦ AI 行程助手</b><p class="sub">可以直接告诉 AI：我要在这个大行程里增加一个地方、安排一天、添加景点/美食/酒店，或者重新优化路线。</p>
  <div class="actions"><button class="mini primary" onclick="quickAI('在当前'+r+'路线中帮我添加一个合适的地方')">AI 添加地方</button><button class="mini" onclick="quickAI('检查当前'+r+'路线有没有时间冲突')">冲突检测</button><button class="mini" onclick="quickAI('自动优化当前'+r+'路线')">优化路线</button></div></div>`;
}
function openTripEditor(index=null){
  const t=index==null?{}:customTrips[index];
  openModal(`<h2>${index==null?'新建大行程':'编辑大行程'}</h2>
    <p class="sub">一级是“总行程”，创建后再进入里面添加二级地方。</p>
    <label>行程名称</label><input id="fTitle" value="${escapeAttr(t.title||'')}" placeholder="例如：国庆福建旅行">
    <label>开始日期</label><input id="fStart" type="date" value="${escapeAttr(t.start||'')}">
    <label>结束日期</label><input id="fEnd" type="date" value="${escapeAttr(t.end||'')}">
    <label>行程说明</label><textarea id="fNote" rows="4" placeholder="例如：轻松游、海边为主">${escapeHTML(t.note||'')}</textarea>
    <div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="saveLevel1(${index==null?'null':index})">保存</button></div>`);
}
function saveLevel1(i){
  const t={id:i===null?('trip_'+Date.now()):customTrips[i].id,title:document.getElementById('fTitle').value.trim()||'未命名大行程',start:document.getElementById('fStart').value,end:document.getElementById('fEnd').value,note:document.getElementById('fNote').value.trim(),places:i===null?[]:(customTrips[i].places||[])};
  if(i===null)customTrips.push(t);else customTrips[i]=t;
  saveCustomTrips();closeModal();route='custom';document.querySelectorAll('#trips .tabs button').forEach((x,k)=>x.classList.toggle('on',k===2));renderTrips();
}
function editLevel1(i){openTripEditor(i)}
function deleteLevel1(i){if(confirm('删除这个一级大行程及其全部二级地方？')){customTrips.splice(i,1);saveCustomTrips();renderTrips()}}
function openPlaceEditor(ti,pi=null){
  const p=pi===null?{}:customTrips[ti].places[pi];
  openModal(`<h2>${pi===null?'添加二级地方':'编辑二级地方'}</h2>
    <p class="sub">例如：福州、平潭、泉州、厦门，或某个具体目的地。</p>
    <label>地方名称</label><input id="pTitle" value="${escapeAttr(p.title||'')}" placeholder="例如：厦门">
    <label>日期</label><input id="pDate" type="date" value="${escapeAttr(p.dateISO||'')}">
    <label>地方说明</label><textarea id="pNote" rows="4">${escapeHTML(p.note||'')}</textarea>
    <div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="savePlace(${ti},${pi===null?'null':pi})">保存</button></div>`);
}
function savePlace(ti,pi){
  const d=document.getElementById('pDate').value;
  const p={title:document.getElementById('pTitle').value.trim()||'未命名地方',dateISO:d,date:d?formatDate(d):'',note:document.getElementById('pNote').value.trim(),items:pi===null?[]:(customTrips[ti].places[pi].items||[])};
  if(pi===null)customTrips[ti].places.push(p);else customTrips[ti].places[pi]=p;
  saveCustomTrips();closeModal();renderTrips();
}
function openPlaceDetail(ti,pi){
  const p=customTrips[ti].places[pi];
  openModal(`<h2>${escapeHTML(p.title)}</h2><div class="kv"><b>日期</b><br>${escapeHTML(p.date||'')}</div><div class="kv"><b>说明</b><br>${escapeHTML(p.note||'')}</div><div class="kv"><b>下面的具体行程</b><br>${p.items&&p.items.length?p.items.map(x=>escapeHTML(x.time||'')+' '+escapeHTML(x.title||'')).join('<br>'):'还没有，可自己添加或让 AI 添加'}</div><div class="actions"><button class="mini primary" onclick="closeModal();openItemEditor(${ti},${pi})">＋ 添加行程</button><button class="mini" onclick="closeModal();aiAddItem(${ti},${pi})">✦ AI 添加</button></div>`);
}
function openItemEditor(ti,pi){
  openModal(`<h2>添加具体行程</h2><label>日期</label><input type="date" id="iDate"><label>时间</label><input type="time" id="iTime"><label>行程内容</label><input id="iTitle" placeholder="例如：日光岩">
  <label>备注</label><textarea id="iNote" rows="3"></textarea><div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="saveItem(${ti},${pi})">保存</button></div>`);
}
function saveItem(ti,pi){
  const x={date:document.getElementById('iDate').value,time:document.getElementById('iTime').value,title:document.getElementById('iTitle').value.trim()||'未命名安排',note:document.getElementById('iNote').value.trim()};
  customTrips[ti].places[pi].items.push(x);saveCustomTrips();closeModal();renderTrips();
}
function aiAddPlace(ti){
  const q=prompt('告诉 AI 想在这个大行程增加什么地方，例如：增加厦门 2 天');
  if(q){go('ai');document.getElementById('aiInput').value=`在大行程“${customTrips[ti].title}”中，${q}。请给我可以直接加入行程的二级地方和日期。`;sendAI()}
}
function aiAddItem(ti,pi){
  const q=prompt('告诉 AI 想在这个地方安排什么，例如：增加鼓浪屿半日游');
  if(q){go('ai');document.getElementById('aiInput').value=`在“${customTrips[ti].title}”的“${customTrips[ti].places[pi].title}”下面，${q}。请生成具体时间和行程。`;sendAI()}
}
function openFixedDetail(id){
  const type=id[0],i=Number(id.slice(2));const x=baseTrips[type][i];
  openModal(`<h2>${escapeHTML(x[1])}</h2><div class="kv"><b>日期</b><br>${escapeHTML(x[0])}</div><div class="kv"><b>当天安排</b><br>${escapeHTML(x[2])}</div><div class="actions"><button class="mini primary" onclick="quickAI('优化'+escapeAttr(x[1])+'并检查冲突')">AI 优化</button><button class="mini" onclick="closeModal()">关闭</button></div>`);
}
function ensureCustomTrips(){if(!Array.isArray(customTrips))customTrips=[];customTrips=customTrips.map(t=>({id:t.id||('trip_'+Date.now()+Math.random()),title:t.title||'未命名行程',start:t.start||'',end:t.end||'',note:t.note||'',places:Array.isArray(t.places)?t.places:[]}))}
function saveCustomTrips(){localStorage.setItem('customTrips',JSON.stringify(customTrips))}
function formatDate(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日`}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function renderSpots(){cityTabs("citySpotTabs");document.getElementById("spotList").innerHTML=(spots[city]||[]).map(x=>`<button class="list-btn glass" onclick="openDetail('景点','${x[0]}','${x[1]}','${x[2]}')"><b>${x[0]}</b><br><span class="sub">${x[1]} · ${x[2]}</span></button>`).join("")}
function renderFood(){cityTabs("cityFoodTabs");document.getElementById("foodList").innerHTML=(foods[city]||[]).map(x=>`<button class="list-btn glass" onclick="openDetail('美食','${x[0]}','${x[1]} · 必点：${x[2]}','${x[3]}')"><b>${x[0]}</b><br><span class="sub">${x[1]} · ${x[3]}</span></button>`).join("")}
function cityTabs(id){document.getElementById(id).innerHTML=Object.keys(spots).map(c=>`<button class="${city===c?'on':''}" onclick="city='${c}';${id.includes('Spot')?'renderSpots()':'renderFood()'}">${c}</button>`).join("")}
function openDetail(type,title,desc,price){openModal(`<h2>${title}</h2><div class="kv"><b>类型</b><br>${type}</div><div class="kv"><b>信息</b><br>${desc}</div><div class="kv"><b>费用</b><br>${price}</div><div class="actions"><button class="mini primary" onclick="addToCurrent('${title}')">加入行程</button><button class="mini" onclick="closeModal()">关闭</button></div>`)}
function addToCurrent(title){let x=prompt("添加到哪一天？例如：10月3日");if(x){customTrips.push({route,date:x,title,desc:`${title} · 通过景点/美食探索加入`});localStorage.setItem("customTrips",JSON.stringify(customTrips));alert("已加入当前路线");}closeModal()}
function renderHotels(){document.getElementById("hotelList").innerHTML=hotels.map(x=>`<button class="list-btn glass" onclick="openDetail('酒店','${x[1]}','${x[2]}','${x[0]}')"><b>${x[1]}</b><br><span class="sub">${x[0]} · ${x[2]}</span></button>`).join("")}
function renderTransport(){document.getElementById("transportList").innerHTML=transports.map(x=>`<button class="list-btn glass" onclick="openDetail('交通','${x[1]}','车次：${x[2]}','${x[3]}')"><b>${x[0]} · ${x[1]}</b><br><span class="sub">${x[2]} · ${x[3]}</span></button>`).join("")}
function openAIAdd(type){openModal(`<h2>AI 添加${type}</h2><p class="sub">告诉 AI 你想添加的城市、类型和偏好。</p><textarea id="addPrompt" rows="5" placeholder="例如：在厦门添加 2 个适合看日落、交通方便的景点"></textarea><div class="actions"><button class="mini" onclick="closeModal()">取消</button><button class="mini primary" onclick="sendAddAI('${type}')">让 AI 推荐</button></div>`)}
function sendAddAI(type){let q=document.getElementById("addPrompt").value||`请推荐${type}`;closeModal();go("ai");document.getElementById("aiInput").value=q;sendAI()}
function quickAI(q){go("ai");document.getElementById("aiInput").value=q;sendAI()}
function addBubble(text,me=false){let d=document.createElement("div");d.className="bubble "+(me?"me":"bot");d.textContent=text;let c=document.getElementById("chat");c.appendChild(d);c.scrollTop=c.scrollHeight}
async function sendAI(){let input=document.getElementById("aiInput"),q=input.value.trim();if(!q)return;addBubble(q,true);input.value="";addBubble("正在分析你的旅行需求……");let last=document.getElementById("chat").lastChild;try{let r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q,route,city})});let data=await r.json();last.textContent=data.reply||data.message||"AI 暂时没有返回内容。"}catch(e){last.textContent="当前预览版未连接线上 AI 接口。部署到你的 Cloudflare 项目后，将自动使用你配置的 AI 后端。"}}
function openModal(content){document.getElementById("sheet").innerHTML=content;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
function clearLocal(){if(confirm("确定清空本地新增行程吗？")){customTrips=[];localStorage.removeItem("customTrips");renderTrips()}}
renderTrips();renderSpots();renderFood();renderHotels();renderTransport();
</script>
</body>
</html>
