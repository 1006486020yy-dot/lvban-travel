<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅伴旅行管家｜数据库视觉预览</title><style>:root{--bg:#f7f5ff;--card:#fff;--text:#171727;--muted:#77788b;--p:#6958f5;--line:#e9e7f2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#e9e3ff,transparent 35%),radial-gradient(circle at 100% 20%,#e4fff3,transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1180px;margin:auto;padding:22px 16px 90px}.hero{padding:24px;border-radius:30px;background:linear-gradient(135deg,#715ff6,#9b7af5 55%,#42bd88);color:#fff}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;opacity:.9}.tabs{display:flex;gap:8px;margin:16px 0}.tab{padding:10px 16px;border:0;border-radius:16px;background:#fff;font-weight:800}.tab.on{background:var(--p);color:#fff}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.chip{white-space:nowrap;border:0;padding:9px 13px;border-radius:14px;background:#fff;color:var(--muted)}.chip.on{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#ffffffdf;border:1px solid #fff;border-radius:22px;padding:16px;box-shadow:0 12px 35px #403a8a12}.card h3{margin:7px 0}.muted{font-size:12px;color:var(--muted);line-height:1.55}.tag{display:inline-block;background:#efedff;color:#5d4de5;padding:4px 8px;border-radius:9px;font-size:10px;margin:3px 3px 0 0}.actions{display:flex;gap:6px;margin-top:12px}.btn{border:0;padding:8px 11px;border-radius:12px;background:#efedff;color:#5d4de5;font-weight:700}.primary{background:var(--p);color:#fff}.section{display:none}.section.on{display:block}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="hero"><h1>旅伴旅行管家</h1><p>全国旅游数据库 · 视觉预览版</p></section><div class="tabs"><button class="tab on" data-k="spots">📍 景点</button><button class="tab" data-k="foods">🍜 美食</button><button class="tab" data-k="hotels">🏨 酒店</button></div><div id="cities" class="chips"></div><section id="spots" class="section on"><div class="grid" id="spotGrid"></div></section><section id="foods" class="section"><div class="grid" id="foodGrid"></div></section><section id="hotels" class="section"><div class="grid" id="hotelGrid"></div></section></main><script>const DB={cities:[{"cityId":"fz","城市":"福州","省份":"福建省","城市级别":"省会","拼音":"fuzhou","热门":true},{"cityId":"pt","城市":"平潭","省份":"福建省","城市级别":"县","拼音":"pingtan","热门":true},{"cityId":"qz","城市":"泉州","省份":"福建省","城市级别":"地级市","拼音":"quanzhou","热门":true},{"cityId":"xm","城市":"厦门","省份":"福建省","城市级别":"副省级市","拼音":"xiamen","热门":true}],spots:[{"spotId":"fz-001","景点名称":"三坊七巷","城市":"福州","省份":"福建省","类型":"历史文化","地址":"福州市鼓楼区南后街","简介":"福州历史文化街区。","推荐游玩时间":"2-3小时","推荐季节":"四季","门票":"免费","开放时间":"全天","经纬度":"","图片":"","标签":"古街,人文","热门程度":"高"},{"spotId":"fz-002","景点名称":"上下杭历史街区","城市":"福州","省份":"福建省","类型":"历史文化","地址":"福州市台江区下杭路","简介":"传统商贸文化街区。","推荐游玩时间":"2小时","推荐季节":"四季","门票":"免费","开放时间":"全天","经纬度":"","图片":"","标签":"古街","热门程度":"高"},{"spotId":"pt-001","景点名称":"猴研岛（68海里景区）","城市":"平潭","省份":"福建省","类型":"海岛风光","地址":"平潭县澳前镇东澳村","简介":"平潭岛东南端海岛景观。","推荐游玩时间":"2-3小时","推荐季节":"春夏秋","门票":"","开放时间":"","经纬度":"","图片":"","标签":"海岛,打卡","热门程度":"高"},{"spotId":"pt-002","景点名称":"坛南湾田美澳沙滩","城市":"平潭","省份":"福建省","类型":"海滩","地址":"平潭县敖东镇坛南湾","简介":"适合看海和日落的沙滩。","推荐游玩时间":"2小时","推荐季节":"春夏秋","门票":"免费","开放时间":"全天","经纬度":"","图片":"","标签":"沙滩,日落","热门程度":"高"},{"spotId":"qz-001","景点名称":"开元寺","城市":"泉州","省份":"福建省","类型":"人文古迹","地址":"泉州市鲤城区西街176号","简介":"泉州代表性历史寺院。","推荐游玩时间":"1-2小时","推荐季节":"四季","门票":"免费","开放时间":"","经纬度":"","图片":"","标签":"寺庙,古城","热门程度":"高"},{"spotId":"qz-002","景点名称":"洛伽寺","城市":"泉州","省份":"福建省","类型":"海岛寺庙","地址":"石狮市永宁镇黄金海岸宫屿岛","简介":"海上寺院景观。","推荐游玩时间":"2小时","推荐季节":"四季","门票":"","开放时间":"","经纬度":"","图片":"","标签":"海景,寺庙","热门程度":"高"},{"spotId":"qz-003","景点名称":"蟳埔村","城市":"泉州","省份":"福建省","类型":"民俗文化","地址":"泉州市丰泽区蟳埔社区","简介":"闽南渔村与簪花文化体验地。","推荐游玩时间":"2-3小时","推荐季节":"四季","门票":"免费","开放时间":"全天","经纬度":"","图片":"","标签":"簪花,民俗","热门程度":"高"},{"spotId":"xm-001","景点名称":"鼓浪屿","城市":"厦门","省份":"福建省","类型":"海岛","地址":"厦门市思明区鼓浪屿","简介":"世界文化遗产海岛街区。","推荐游玩时间":"1天","推荐季节":"四季","门票":"免费","开放时间":"全天","经纬度":"","图片":"","标签":"海岛,建筑","热门程度":"高"},{"spotId":"xm-002","景点名称":"日光岩","城市":"厦门","省份":"福建省","类型":"自然景观","地址":"厦门市思明区鼓浪屿晃岩路62号","简介":"鼓浪屿制高点。","推荐游玩时间":"1小时","推荐季节":"四季","门票":"","开放时间":"","经纬度":"","图片":"","标签":"登高,观景","热门程度":"高"},{"spotId":"xm-003","景点名称":"菽庄花园","城市":"厦门","省份":"福建省","类型":"园林","地址":"厦门市思明区鼓浪屿港后路3号","简介":"海滨园林景观。","推荐游玩时间":"1-2小时","推荐季节":"四季","门票":"","开放时间":"","经纬度":"","图片":"","标签":"园林,海景","热门程度":"高"},{"spotId":"xm-004","景点名称":"黄厝沙滩","城市":"厦门","省份":"福建省","类型":"海滩","地址":"厦门市思明区环岛南路黄厝海滨","简介":"环岛路热门海滩。","推荐游玩时间":"2小时","推荐季节":"春夏秋","门票":"免费","开放时间":"全天","经纬度":"","图片":"","标签":"沙滩,日落","热门程度":"高"},{"spotId":"xm-005","景点名称":"南普陀寺","城市":"厦门","省份":"福建省","类型":"寺庙","地址":"厦门市思明区思明南路515号","简介":"厦门代表性佛教寺院。","推荐游玩时间":"2小时","推荐季节":"四季","门票":"免费","开放时间":"","经纬度":"","图片":"","标签":"寺庙,人文","热门程度":"高"}],foods:[{"foodId":"fz-f001","店名":"福州鱼丸老字号","城市":"福州","地址":"福州市鼓楼区","类型":"小吃","推荐菜":"鱼丸","人均":"30","标签":"福州小吃","经纬度":"","图片":""},{"foodId":"pt-f001","店名":"平潭海鲜餐厅","城市":"平潭","地址":"平潭县龙王头附近","类型":"海鲜","推荐菜":"海鲜","人均":"80","标签":"海鲜","经纬度":"","图片":""},{"foodId":"qz-f001","店名":"泉州面线糊","城市":"泉州","地址":"泉州市鲤城区","类型":"小吃","推荐菜":"面线糊","人均":"15","标签":"泉州小吃","经纬度":"","图片":""},{"foodId":"xm-f001","店名":"厦门沙茶面","城市":"厦门","地址":"厦门市思明区","类型":"小吃","推荐菜":"沙茶面","人均":"25","标签":"厦门小吃","经纬度":"","图片":""}],hotels:[{"hotelId":"fz-h001","酒店名称":"锦江都城酒店（福州三坊七巷东街口地铁站店）","城市":"福州","地址":"福州市鼓楼区省府路9号","经纬度":"","星级":"4星","价格区间":"300-500","标签":"市中心,地铁","图片":"","用户收藏":false},{"hotelId":"pt-h001","酒店名称":"维也纳酒店（福州平潭龙王头沙滩店）","城市":"平潭","地址":"平潭县海坛街道西航路190号","经纬度":"","星级":"4星","价格区间":"250-450","标签":"龙王头,海边","图片":"","用户收藏":false},{"hotelId":"qz-h001","酒店名称":"维也纳酒店（泉州古城浦西万达店）","城市":"泉州","地址":"泉州市丰泽区泉秀街768号","经纬度":"","星级":"4星","价格区间":"250-450","标签":"古城,万达","图片":"","用户收藏":false},{"hotelId":"xm-h001","酒店名称":"西岸酒店厦门火车站店","城市":"厦门","地址":"厦门市思明区火车站附近","经纬度":"","星级":"","价格区间":"","标签":"火车站,交通便利","图片":"","用户收藏":false}]};let city='全部';const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function renderCities(){const all=[...new Set(DB.cities.map(x=>x.城市))];cities.innerHTML=['全部',...all].map(c=>`<button class="chip ${c===city?'on':''}" onclick="city='${esc(c)}';render()">${esc(c)}</button>`).join('')}function filter(a){return city==='全部'?a:a.filter(x=>(x.城市||'')===city)}function render(){renderCities();spotGrid.innerHTML=filter(DB.spots).map(x=>`<article class="card"><span class="tag">${esc(x.类型)}</span><h3>${esc(x.景点名称)}</h3><div class="muted">${esc(x.地址)}</div><div class="muted">${esc(x.简介)}</div><div class="actions"><button class="btn" onclick="alert('导航：${esc(x.地址)}')">导航</button><button class="btn primary" onclick="alert('已准备加入行程：${esc(x.景点名称)}')">加入行程</button></div></article>`).join('');foodGrid.innerHTML=filter(DB.foods).map(x=>`<article class="card"><span class="tag">${esc(x.类型)}</span><h3>${esc(x.店名)}</h3><div class="muted">${esc(x.地址)}</div><div class="muted">推荐：${esc(x.推荐菜)} · 人均：${esc(x.人均)}</div><div class="actions"><button class="btn" onclick="navigator.clipboard?.writeText('${esc(x.地址)}');alert('地址已复制')">复制地址</button><button class="btn primary">加入行程</button></div></article>`).join('');hotelGrid.innerHTML=filter(DB.hotels).map(x=>`<article class="card"><span class="tag">${esc(x.星级)}</span><h3>${esc(x.酒店名称)}</h3><div class="muted">${esc(x.地址)}</div><div class="muted">${esc(x.价格区间)} · ${esc(x.标签)}</div><div class="actions"><button class="btn">导航</button><button class="btn primary">加入行程</button></div></article>`).join('')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.k).classList.add('on')});render();</script></body></html>
