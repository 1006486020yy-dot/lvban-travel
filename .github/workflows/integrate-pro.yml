name: Integrate TravelMate Pro layer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach Pro data and interaction layers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="data.js"></script>'
          if marker not in s:
              block='\n<script src="data.js"></script>\n<script src="storage.js"></script>\n<script src="pro.js"></script>\n'
              if '</body>' in s:
                  s=s.replace('</body>', block+'</body>', 1)
              else:
                  s += block
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: integrate TravelMate Pro data and interactions'
          git push
