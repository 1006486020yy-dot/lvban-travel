name: Fix TravelMate build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inline JavaScript and ensure share layer is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("x.style.background='#222;color='#fff'", "x.style.background='#222';x.style.color='#fff'")
          if '<script src="share-fix.js"></script>' not in s:
              s=s.replace('</body>', '<script src="share-fix.js"></script>\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: load itinerary share layer'
          git push
