name: Fix TravelMate build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inline JavaScript and ensure share layers are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("x.style.background='#222;color='#fff'", "x.style.background='#222';x.style.color='#fff'")
          for src in ['share-fix.js','share-list.js','travelmate-cross-device-fix.js']:
              tag=f'<script src="{src}"></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: ensure cross-device itinerary sharing layer is loaded'
          git push
