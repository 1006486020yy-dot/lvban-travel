name: Fix TravelMate build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inline JavaScript and ensure share layers are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("x.style.background='#222;color='#fff'", "x.style.background='#222';x.style.color='#fff'")
          for src in ['share-fix.js','share-list.js']:
              tag=f'<script src="{src}"></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
          ai_tag='<script src="data/ai-composer-hard-fix.js?v=20260915-2"></script>'
          old_tag='<script src="data/ai-composer-hard-fix.js?v=20260915-1"></script>'
          if old_tag in s:
              s=s.replace(old_tag,ai_tag)
          elif ai_tag not in s:
              s=s.replace('</body>', ai_tag+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: final AI composer positioning'
          git push
