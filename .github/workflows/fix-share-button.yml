name: Fix TravelMate share button
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-share-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure share button is injected after the final itinerary render
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('itinerary-layout-final.js')
          s = p.read_text(encoding='utf-8')
          marker = 'setInterval(injectShareButton,500);'
          if marker not in s:
              target = '  shareStyles();\n  const observer=new MutationObserver'
              replacement = '  shareStyles();\n  setTimeout(injectShareButton,0);\n  setTimeout(injectShareButton,300);\n  setTimeout(injectShareButton,1000);\n  setInterval(injectShareButton,500);\n  const observer=new MutationObserver'
              if target not in s:
                  raise SystemExit('share injection anchor not found')
              p.write_text(s.replace(target, replacement, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-layout-final.js
          git commit -m 'fix: ensure itinerary share button is visible'
          git push
